/* ================= THEME (dark/light) ================= */
const THEME_KEY = 'egygulf-foods-theme-v1';

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.innerHTML = svgIcon(theme==='dark' ? 'sun' : 'moon');
}

async function loadTheme(){
  let theme = null;
  try{
    const res = await StorageAPI.get(THEME_KEY, false);
    if(res && res.value) theme = res.value;
  }catch(e){ /* not set yet */ }
  if(!theme){
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
}

async function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ await StorageAPI.set(THEME_KEY, next, false); }catch(e){ /* ignore */ }
}

/* ================= LOW STOCK NOTIFICATIONS ================= */
function updateNotifBell(){
  const bell = document.getElementById('notifBell');
  const badge = document.getElementById('notifBadge');
  if(!bell) return;
  // (re)draw the bell icon while preserving the badge element
  if(!bell.querySelector('.icon-svg')) bell.insertAdjacentHTML('afterbegin', svgIcon('bell'));

  const low = lowStockItems();
  if(low.length){
    badge.textContent = low.length > 99 ? '99+' : low.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  renderNotifDropdown(low);
}

function renderNotifDropdown(low){
  const dd = document.getElementById('notifDropdown');
  if(!dd) return;
  if(!low || !low.length){
    dd.innerHTML = `<div class="notif-empty">لا يوجد أصناف تحت حد الأمان حاليًا 👍</div>`;
    return;
  }
  dd.innerHTML = `
    <div class="notif-dd-head">أصناف تحت حد الأمان (${low.length})</div>
    <div class="notif-dd-list">
      ${low.map(it=>`
        <button class="notif-dd-item" data-kind="raw">
          <span class="notif-dd-name">${esc(it.name)}${it.kind?` — ${esc(it.kind)}`:''}</span>
          <span class="notif-dd-bal">${fmtNum(it.balance)}</span>
        </button>`).join('')}
    </div>
    <div class="notif-dd-foot">حد الأمان الحالي: ${fmtNum(DB.settings.lowStockThreshold)}</div>`;

  dd.querySelectorAll('.notif-dd-item').forEach(b=>{
    b.addEventListener('click', ()=>{
      closeNotifDropdown();
      setTab(b.dataset.kind);
    });
  });
}

function closeNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  if(dd) dd.classList.add('hidden');
}

function initNotifBell(){
  const bell = document.getElementById('notifBell');
  const dd = document.getElementById('notifDropdown');
  if(!bell || !dd) return;
  bell.addEventListener('click', (e)=>{
    e.stopPropagation();
    dd.classList.toggle('hidden');
  });
  document.addEventListener('click', (e)=>{
    if(!dd.classList.contains('hidden') && !e.target.closest('.notif-wrap')) closeNotifDropdown();
  });
}

          return `

            <td style="font-weight:700">${esc(o.ono||'—')}</td>
            <td>${esc(o.cust||'—')}</td>
            <td>${esc(o.sales||'—')}</td>
            <td>${fmtDateAr(o.dt)}</td>
            <td>${fmtDateAr(o.due)}</td>
            <td class="num">${fmtNum((Number(o.totalProd)||0)/1000)}</td>
            <td>${dispatched? '<span class="pill pill-ok">تم الصرف ✓</span>' : '<span class="pill pill-warn">لسه متصرفش</span>'}</td>
            <td><div class="btn-icon-row">
              <button class="btn btn-sm btn-ghost" data-act="detail" data-id="${esc(o.id)}">التفاصيل</button>
              ${isAdmin? `<button class="icon-btn danger" data-act="delete" data-id="${esc(o.id)}" title="حذف الأوردر">${svgIcon('trash','sm')}</button>` : ''}
            </div></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>` : `<div class="empty-state">${svgIcon('orders')}<div>لسه مفيش أوردرات مستوردة — صدّر ملف من نظام الإنتاج واستورده هنا</div></div>`}
    </div>
  </div>`;
  document.getElementById('content').innerHTML = `<div class="content-fade">${html}</div>`;
  document.querySelectorAll('[data-act="detail"]').forEach(b=>b.addEventListener('click', ()=> openExternalOrderDetail(b.dataset.id)));
  document.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', ()=>{
    const o = (DB.importedOrders||[]).find(x=>x.id===b.dataset.id);
    if(!o) return;
    if(findDispatch(o.id)){ showToast('الأوردر ده اتصرف بالفعل، متقدرش تحذفه'); return; }
    openConfirmModal(`هل تريد حذف الأوردر "${esc(o.ono||o.cust||'')}"؟`, async ()=>{
      DB.importedOrders = DB.importedOrders.filter(x=>x.id!==o.id);
      logAction(`حذف أوردر عميل "${o.ono||''} — ${o.cust||''}"`);
      await persist();
      renderExternalOrdersTab();
      renderNav();
      showToast('تم حذف الأوردر');
    });
  }));
  const openBtn = document.getElementById('openOrderSystemBtn');
  if(openBtn){
    openBtn.addEventListener('click', ()=>{
      const url = (DB.settings && DB.settings.orderSystemUrl) || '';
      if(!url){ showToast('محتاج تحط لينك نظام الأوردرات الأول من زرار "إعدادات" فوق'); return; }
      window.open(url, '_blank');
    });
  }
  const importBtn = document.getElementById('importOrdersBtn');
  const importFile = document.getElementById('importOrdersFile');
  if(importBtn && importFile){
    importBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          const arr = Array.isArray(data) ? data : [data];
          if(!arr.length){ showToast('الملف فاضي، مفيش أوردرات فيه'); return; }
          if(!DB.importedOrders) DB.importedOrders = [];
          let addedCount = 0, updatedCount = 0;
          arr.forEach(o=>{
            if(!o || !o.id) return;
            const idx = DB.importedOrders.findIndex(x=>x.id===o.id);
            if(idx>=0){ DB.importedOrders[idx] = o; updatedCount++; }
            else { DB.importedOrders.push(o); addedCount++; }
          });
          logAction(`استورد أوردرات عملاء: ${addedCount} جديد${updatedCount?`، ${updatedCount} اتحدّث`:''}`);
          await persist();
          renderNav();
          renderExternalOrdersTab();
          showToast(`تم الاستيراد: ${addedCount} أوردر جديد${updatedCount? `، ${updatedCount} اتحدّث`:''}`);
        }catch(err){
          showToast('الملف مش JSON صحيح — تأكد إنك مصدّره من نظام الأوردرات نفسه');
        }
        importFile.value = '';
      };
      reader.readAsText(file);
    });
  }
}

function openExternalOrderDetail(orderId){
  const o = (DB.importedOrders||[]).find(x=>x.id===orderId);
  if(!o){ showToast('الأوردر ده مش موجود دلوقتي'); return; }
  const rows = o.rows || [];
  const dispatch = findDispatch(orderId);
  document.getElementById('drawerRoot').innerHTML = `
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer">
      <div class="drawer-head">
        <div>
          <h3>أوردر ${esc(o.ono||'—')} — ${esc(o.cust||'—')}</h3>
          <div class="sub">السيلز: ${esc(o.sales||'—')} · تاريخ الأوردر: ${fmtDateAr(o.dt)} · التسليم: ${fmtDateAr(o.due)}</div>
        </div>
        <button class="modal-close" id="drawerClose">✕</button>
      </div>
      <div class="drawer-body">
        <div class="cards-grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px;">
          <div class="stat-card" style="padding:12px 14px;">
            <div class="label">إجمالي الإنتاج</div>
            <div class="value" style="font-size:19px;">${fmtNum((Number(o.totalProd)||0)/1000)} كجم</div>
          </div>
          <div class="stat-card" style="padding:12px 14px;">
            <div class="label">أصناف بستيكر</div>
            <div class="value" style="font-size:19px;">${fmtNum(o.totalStk||0)}</div>
          </div>
          <div class="stat-card" style="padding:12px 14px;">
            <div class="label">عدد بنود الأوردر</div>
            <div class="value" style="font-size:19px;">${rows.length}</div>
          </div>
        </div>
        ${isAdmin ? `
        <div class="panel" style="padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <div>
            <strong>الصرف من مخزن الإنتاج التام</strong>
            <div class="muted" style="font-size:12.5px;">${dispatch? `تم الصرف بتاريخ ${fmtDateAr(dispatch.date)}` : 'لسه الأوردر ده متأثرش على أرصدة المخازن'}</div>
          </div>
          ${dispatch
            ? `<button class="btn btn-ghost btn-sm" id="undoDispatchBtn">تراجع عن الصرف</button>`
            : `<button class="btn btn-gold btn-sm" id="doDispatchBtn">تسجيل صرف لهذا الأوردر</button>`}
        </div>` : ''}
        ${rows.length? `
        <div class="table-wrap"><table>
          <thead><tr><th>المنتج</th><th>خط الإنتاج</th><th>وزن الحبة (جم)</th><th>عدد بالوحدة</th><th>وحدات/كرتونة</th><th>عدد الكراتين</th><th>بستيكر</th><th>ملاحظات</th></tr></thead>
          <tbody>
          ${rows.map(r=>`
            <tr>
              <td style="font-weight:700">${esc(r.d||'—')}</td>
              <td><span class="pill pill-navy">${esc(r.line||'—')}</span></td>
              <td class="num">${fmtNum(r.g)}</td>
              <td class="num">${fmtNum(r.s)}</td>
              <td class="num">${fmtNum(r.u)}</td>
              <td class="num">${fmtNum(r.q)}</td>
              <td>${r.so? '<span class="pill pill-ok">بستيكر</span>' : '<span class="muted">بدون</span>'}</td>
              <td class="muted">${r.n?esc(r.n):'—'}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>` : `<div class="empty-state">لا يوجد بنود في هذا الأوردر</div>`}
      </div>
    </div>`;
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  const doBtn = document.getElementById('doDispatchBtn');
  if(doBtn) doBtn.addEventListener('click', ()=> openDispatchModal(o));
  const undoBtn = document.getElementById('undoDispatchBtn');
  if(undoBtn) undoBtn.addEventListener('click', ()=>{
    openConfirmModal('هل تريد التراجع عن صرف هذا الأوردر؟ الكميات هترجع لرصيد مخزن الإنتاج التام.', async ()=>{
      const d = findDispatch(o.id);
      if(d){
        d.lines.forEach(ln=>{
          const item = DB.whFinished.find(i=>i.id===ln.itemId) || DB.whFinished.find(i=>i.name.trim()===ln.itemName);
          if(item){
            item.balance = Math.round((item.balance + Number(ln.qty||0))*100)/100;
            item.history = (item.history||[]).filter(h=>h.refId!==d.id+'_'+ln.itemId);
          }
        });
        DB.dispatches = DB.dispatches.filter(x=>x.id!==d.id);
      }
      logAction(`تراجع عن صرف أوردر ${o.ono||''} — العميل ${o.cust||''}`);
      await persist();
      renderNav();
      openExternalOrderDetail(o.id);
      showToast('تم التراجع عن الصرف وترجيع الأرصدة');
    });
  });
}

function openDispatchModal(order){
  if(!isAdmin){ showToast('لازم تسجل دخول كأدمن الأول'); return; }
  if(findDispatch(order.id)){ showToast('الأوردر ده اتصرف بالفعل'); return; }
  const rows = order.rows || [];
  const finishedNames = [...new Set(DB.whFinished.map(i=>i.name))].sort((a,b)=>a.localeCompare(b,'ar'));

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:560px;max-height:85vh;overflow-y:auto;">
        <div class="modal-head"><h3>تسجيل صرف أوردر ${esc(order.ono||'')} من مخزن الإنتاج التام</h3><button class="modal-close" id="closeX">✕</button></div>
        <div class="modal-body">
          <div class="muted" style="font-size:12.5px;margin-bottom:12px;">راجع اسم الصنف والكمية لكل بند قبل الحفظ — الكمية المقترحة = عدد الوحدات × عدد الكراتين.</div>
          ${rows.map((r,idx)=>{
            const suggestedQty = (Number(r.u)||0)*(Number(r.q)||0);
            const matched = DB.whFinished.find(i=>i.name.trim()===String(r.d||'').trim());
            return `
            <div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;">
              <div style="font-weight:700;margin-bottom:8px;">${esc(r.d||'بند بدون اسم')}</div>
              <div class="field"><label>الصنف في مخزن الإنتاج التام *</label>
                <input type="text" data-dispatch-field="itemName" data-idx="${idx}" value="${esc(matched?matched.name:(r.d||''))}" list="finList_${idx}">
                <datalist id="finList_${idx}">${finishedNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
              </div>
              <div class="field"><label>الكمية *</label><input type="number" step="0.01" data-dispatch-field="qty" data-idx="${idx}" value="${suggestedQty||''}"></div>
            </div>`;
          }).join('')}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">حفظ الصرف</button>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const lines = rows.map((r, idx)=>{
      const nameInput = document.querySelector(`[data-dispatch-field="itemName"][data-idx="${idx}"]`);
      const qtyInput = document.querySelector(`[data-dispatch-field="qty"][data-idx="${idx}"]`);
      return { productName: r.d, itemName: (nameInput.value||'').trim(), qty: Number(qtyInput.value) };
    }).filter(ln=> ln.itemName && ln.qty>0);

    if(!lines.length){ showToast('محتاج بند واحد صحيح على الأقل (اسم صنف وكمية)'); return; }

    const dispatchId = uid();
    const date = todayISO();
    const savedLines = [];
    lines.forEach(ln=>{
      let item = DB.whFinished.find(i=>i.name.trim()===ln.itemName);
      if(!item){
        item = {id:uid(), name:ln.itemName, balance:0, history:[]};
        DB.whFinished.unshift(item);
      }
      item.balance = Math.round((item.balance - ln.qty)*100)/100;
      item.history = item.history || [];
      item.history.push({date, type:'صرف', qty:ln.qty, notes:`صرف لأوردر ${order.ono||''} — العميل ${order.cust||''}`, refId: dispatchId+'_'+item.id, by: userTag()});
      savedLines.push({productName: ln.productName, itemId:item.id, itemName:item.name, qty:ln.qty});
    });

    DB.dispatches.unshift({id:dispatchId, orderId:order.id, ono:order.ono||'', cust:order.cust||'', date, lines:savedLines});
    logAction(`سجّل صرف أوردر ${order.ono||''} — العميل ${order.cust||''}`);
    await persist();
    closeModal();
    renderNav();
    openExternalOrderDetail(order.id);
    showToast('تم تسجيل الصرف وتحديث رصيد مخزن الإنتاج التام');
  });
}

/* ================= تسجيل الدخول ================= */
function userTag(){
  if(!currentUser) return '—';
  return `${currentUser.name}${currentUser.username?' - '+currentUser.username:''}`;
}

function logAction(text){
  if(!DB.auditLog) DB.auditLog = [];
  DB.auditLog.unshift({
    id: uid(),
    ts: new Date().toISOString(),
    name: currentUser ? currentUser.name : '',
    username: currentUser ? currentUser.username : '',
    role: currentUser ? currentUser.role : '',
    action: text
  });
  if(DB.auditLog.length > 1000) DB.auditLog.length = 1000;
}

function showLoginScreen(){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  const passInput = document.getElementById('loginPass');
  const userInput = document.getElementById('loginUsername');
  const errBox = document.getElementById('loginError');

  const submit = ()=>{
    const username = userInput.value.trim().toLowerCase();
    const pass = passInput.value;
    if(!username || !pass){
      errBox.textContent = 'اكتب اسم المستخدم وكلمة السر';
      errBox.classList.remove('hidden');
      return;
    }
    const user = (DB.users||[]).find(u=> u.username.toLowerCase()===username);
    if(user && user.password===pass){
      currentUser = {username:user.username, role:user.role, name:user.name||user.username};
      try{ localStorage.setItem(AUTH_KEY, JSON.stringify(currentUser)); }catch(e){ /* ignore */ }
      errBox.classList.add('hidden');
      passInput.value = '';
      logAction(`تسجيل دخول (${user.name||user.username})`);
      persist(true);
      enterApp();
    } else {
      errBox.textContent = 'اسم المستخدم أو كلمة السر غلط';
      errBox.classList.remove('hidden');
    }
  };
  document.getElementById('loginSubmitBtn').onclick = submit;
  [passInput, userInput].forEach(inp=>{
    inp.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  });
}

/* ================= تنبيه صوتي لطلبات القاهرة الجديدة ================= */
let knownCairoRequestIds = new Set();
let cairoPollTimer = null;

function playNotifBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.18].forEach((offset, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(i===0? 880 : 1046, now+offset);
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.28, now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+offset);
      osc.stop(now+offset+0.34);
    });
  }catch(e){ /* الصوت مش شرط أساسي، لو المتصفح رفض نتجاهل بهدوء */ }
}

async function pollCairoRequests(){
  if(!currentUser || currentUser.role==='cairo') return;
  try{
    const res = await StorageAPI.get(STORAGE_KEY, false);
    if(!res || !res.value) return;
    const remote = JSON.parse(res.value);
    const remoteList = remote.cairoRequests || [];
    const newOnes = remoteList.filter(r=> !knownCairoRequestIds.has(r.id));
    if(newOnes.length){
      newOnes.forEach(r=>{
        const exists = (DB.cairoRequests||[]).some(x=>x.id===r.id);
        if(!exists){ if(!DB.cairoRequests) DB.cairoRequests=[]; DB.cairoRequests.unshift(r); }
      });
      playNotifBeep();
      const label = newOnes.length===1 ? (CR_TYPE_LABEL[newOnes[0].type]?CR_TYPE_LABEL[newOnes[0].type].label:'طلب') : `${newOnes.length} طلبات`;
      showToast(`📩 طلب جديد من القاهرة (${label})`);
      renderNav();
      if(currentTab==='cairoRequests') renderCairoRequestsTab();
    }
    remoteList.forEach(r=> knownCairoRequestIds.add(r.id));
  }catch(e){ /* تجاهل أخطاء الشبكة المؤقتة */ }
}

function startCairoPolling(){
  knownCairoRequestIds = new Set((DB.cairoRequests||[]).map(r=>r.id));
  if(cairoPollTimer) clearInterval(cairoPollTimer);
  if(currentUser && currentUser.role!=='cairo'){
    cairoPollTimer = setInterval(pollCairoRequests, 20000);
  }
}
function stopCairoPolling(){
  if(cairoPollTimer){ clearInterval(cairoPollTimer); cairoPollTimer=null; }
}

function logoutUser(){
  if(currentUser){ logAction('تسجيل خروج'); persist(true); }
  currentUser = null;
  isAdmin = false;
  stopCairoPolling();
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){ /* ignore */ }
  document.getElementById('app').classList.add('hidden');
  showLoginScreen();
}

function enterApp(){
  isAdmin = (currentUser && currentUser.role==='admin');
  currentTab = firstAllowedTab();
  document.getElementById('pageTitle').textContent = TITLES[currentTab][0];
  document.getElementById('pageSub').textContent = TITLES[currentTab][1];
  renderNav();
  renderContent();
  renderAdminArea();
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  startCairoPolling();
}

/* ================= BOOT ================= */
async function boot(){
  await loadTheme();
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  await loadDB();
  initNotifBell();
  updateNotifBell();
  let stored = null;
  try{ stored = JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ /* ignore */ }
  if(stored && stored.username && (DB.users||[]).some(u=> u.username===stored.username)){
    currentUser = stored;
    enterApp();
  } else {
    showLoginScreen();
  }
}

document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
});
document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
});

boot();
</script>
