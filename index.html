        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  const rowsWrap = document.getElementById('crProductRows');
  function addRow(){
    const div = document.createElement('div');
    div.innerHTML = crProductRowHtml(crProductRowCount, document.getElementById('f_type').value==='order');
    const rowEl = div.firstElementChild;
    rowsWrap.appendChild(rowEl);
    crProductRowCount++;
    wireRemoveButtons();
  }
  function wireRemoveButtons(){
    rowsWrap.querySelectorAll('.cr-remove-row').forEach(btn=>{
      btn.onclick = ()=>{
        if(rowsWrap.children.length>1){ btn.closest('.cr-product-row').remove(); }
        else { showToast('لازم تسيب منتج واحد على الأقل'); }
      };
    });
  }
  addRow();
  document.getElementById('crAddRowBtn').addEventListener('click', addRow);

  document.getElementById('f_type').addEventListener('change', (e)=>{
    const isOrder = e.target.value==='order';
    document.getElementById('orderFieldsWrap').style.display = isOrder? 'flex':'none';
    document.querySelectorAll('.cr-price-field').forEach(f=> f.style.display = isOrder? '' : 'none');
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const type = document.getElementById('f_type').value;
    const notes = document.getElementById('f_notes').value.trim();
    const products = [...rowsWrap.querySelectorAll('.cr-product-row')].map(row=>{
      const name = row.querySelector('.cr_p_name').value.trim();
      const qty = Number(row.querySelector('.cr_p_qty').value);
      const price = type==='order' ? Number(row.querySelector('.cr_p_price').value)||0 : undefined;
      const flavor = row.querySelector('.cr_p_flavor').value.trim();
      return {name, qty, price, flavor};
    }).filter(p=> p.name && p.qty>0);
    if(!products.length){ showToast('اكتب منتج واحد على الأقل بكمية صحيحة'); return; }
    let salesName='', customerName='', customerPhone='';
    if(type==='order'){
      salesName = document.getElementById('f_salesName').value.trim();
      customerName = document.getElementById('f_customerName').value.trim();
      customerPhone = document.getElementById('f_customerPhone').value.trim();
      if(!salesName || !customerName || !customerPhone){ showToast('كمّل بيانات السيلز والعميل'); return; }
    }
    if(!DB.cairoRequests) DB.cairoRequests = [];
    DB.cairoRequests.unshift({
      id: uid(), date: todayISO(), ts: new Date().toISOString(),
      type, products, salesName, customerName, customerPhone, notes, status:'new',
      requestedByName: currentUser? currentUser.name : '',
      requestedByUsername: currentUser? currentUser.username : '',
    });
    logAction(`طلب ${CR_TYPE_LABEL[type].label} من القاهرة (${products.length} منتج)`);
    await persist();
    closeModal();
    renderCairoRequestsTab();
    renderNav();
    showToast('تم إرسال الطلب لطنطا');
  });
}

function advanceCairoRequest(id, nextStatus){
  const r = (DB.cairoRequests||[]).find(x=>x.id===id);
  if(!r) return;
  r.status = nextStatus;
  r.updatedByName = currentUser? currentUser.name : '';
  r.updatedAt = new Date().toISOString();
  const statusLabel = CR_STATUS_LABEL[nextStatus] ? CR_STATUS_LABEL[nextStatus].label : nextStatus;
  logAction(`${statusLabel} — طلب قاهرة (${CR_TYPE_LABEL[r.type].label})`);
  persist().then(()=>{
    renderCairoRequestsTab();
    renderNav();
    showToast(`تم تحديث حالة الطلب: ${statusLabel}`);
  });
}

/* ================= طلبات مشتريات (Purchase Requests) ================= */
const PR_STATUS_LABEL = {

  purchased: {label:'تم الشراء', cls:'pill-navy'},
};

function renderPurchaseRequestsTab(){
  const list = [...(DB.purchaseRequests||[])].sort((a,b)=> (b.ts||b.date||'').localeCompare(a.ts||a.date||''));
  let html = `
  <div class="panel">

      ${list.length? `
      <div class="table-wrap"><table>
        <thead><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>ملاحظات</th><th>طلب بواسطة</th><th>الحالة</th><th></th></tr></thead>
        <tbody>
        ${list.map(r=>{
          const st = PR_STATUS_LABEL[r.status] || PR_STATUS_LABEL.pending;
          const actions = [];
          if(isAdmin && r.status==='pending'){
            actions.push(`<button class="btn btn-sm btn-ghost" data-act="approve" data-id="${r.id}">قبول</button>`);
            actions.push(`<button class="btn btn-sm btn-ghost" data-act="reject" data-id="${r.id}">رفض</button>`);
          }
          if(isAdmin && r.status==='approved'){
            actions.push(`<button class="btn btn-sm btn-ghost" data-act="mark-purchased" data-id="${r.id}">تم الشراء</button>`);
          }
          if(isAdmin || (currentUser && r.requestedByUsername===currentUser.username && r.status==='pending')){
            actions.push(`<button class="icon-btn danger" data-act="delete" data-id="${r.id}" title="حذف">${svgIcon('trash','sm')}</button>`);
          }
          return `
          <tr data-id="${r.id}">
            <td>${fmtDateAr(r.date)}</td>
            <td style="font-weight:700">${esc(r.itemName)}</td>
            <td class="num">${fmtNum(r.qty)}</td>
            <td class="muted">${r.notes? esc(r.notes) : '—'}</td>
            <td>${esc(r.requestedByName||'—')}</td>
            <td><span class="pill ${st.cls}">${st.label}</span>${r.status!=='pending' && r.reviewedByName? `<div class="muted" style="font-size:11px;margin-top:3px;">بواسطة ${esc(r.reviewedByName)}</div>`:''}</td>
            <td><div class="btn-icon-row">${actions.join('')}</div></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>` : `<div class="empty-state">${svgIcon('orders')}<div>لسه مفيش طلبات مشتريات — اضغط "طلب شراء جديد" عشان تبدأ</div></div>`}
    </div>
  </div>`;
  document.getElementById('content').innerHTML = `<div class="content-fade">${html}</div>`;
  document.getElementById('addPurchaseRequestBtn').addEventListener('click', openPurchaseRequestModal);

  document.querySelectorAll('[data-act="reject"]').forEach(b=>b.addEventListener('click', ()=> reviewPurchaseRequest(b.dataset.id, 'rejected')));
  document.querySelectorAll('[data-act="mark-purchased"]').forEach(b=>b.addEventListener('click', ()=> reviewPurchaseRequest(b.dataset.id, 'purchased')));
  document.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', ()=>{
    const r = (DB.purchaseRequests||[]).find(x=>x.id===b.dataset.id);

      DB.purchaseRequests = DB.purchaseRequests.filter(x=>x.id!==b.dataset.id);

      renderPurchaseRequestsTab();
      renderNav();
      showToast('تم حذف الطلب');

function reviewPurchaseRequest(id, status){
  const r = (DB.purchaseRequests||[]).find(x=>x.id===id);
  if(!r) return;
  const doIt = async ()=>{
    r.status = status;
    r.reviewedByName = currentUser? currentUser.name : '';
    r.reviewedByUsername = currentUser? currentUser.username : '';
    r.reviewedAt = new Date().toISOString();
    const statusLabel = PR_STATUS_LABEL[status] ? PR_STATUS_LABEL[status].label : status;
    logAction(`${statusLabel} — طلب شراء "${r.itemName}" (${fmtNum(r.qty)})`);
    await persist();
    renderPurchaseRequestsTab();
    renderNav();
    showToast(`تم تحديث حالة الطلب: ${statusLabel}`);
  };
  if(status==='rejected'){
    openConfirmModal(`هل تريد رفض طلب شراء "${esc(r.itemName)}"؟`, doIt);
  } else {
    doIt();
  }
}

        if(item){
          const sign = isReturn ? 1 : -1; // مرتجع كان نقص من الرصيد، فحذفه يرجّعه بالزيادة، والعكس للشراء
          item.balance = Math.round((item.balance + sign*p.qty)*100)/100;
          item.history = (item.history||[]).filter(h=>h.refId!==p.id);
        }
      }
      DB.purchases = DB.purchases.filter(x=>x.id!==b.dataset.id);
      logAction(`حذف سجل ${isReturn?'مرتجع':'شراء'}${p?` — "${p.itemName}" (${fmtNum(p.qty)})`:''}`);
      await persist();
      renderPurchasesTab();
      renderNav();
      showToast('تم حذف السجل وترجيع الرصيد');
    });
  }));
}

  kind = kind || 'purchase';

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><h3>${isReturn?'تسجيل مرتجع':'تسجيل مشترى جديد'}</h3><button class="modal-close" id="closeX">✕</button></div>
        <div class="modal-body">
          <div class="field"><label>اسم الخامة *</label>
            <input type="text" id="f_item" list="rawNamesList" placeholder="${isReturn?'اختار اسم خامة موجودة':'اكتب اسم خامة موجودة أو خامة جديدة'}">
            <datalist id="rawNamesList">${rawNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>

          <div class="field"><label>${isReturn?'المرتجع لـ (المورد)':'المورد'}</label><input type="text" id="f_supplier"></div>
          <div class="field"><label>التاريخ *</label><input type="date" id="f_date" value="${todayISO()}"></div>
          <div class="field"><label>${isReturn?'سبب المرتجع':'ملاحظات'}</label><input type="text" id="f_notes" placeholder="${isReturn?'مثال: خامة تالفة / مخالفة للمواصفات':''}"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">حفظ</button>

      </div>
    </div>`;
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async ()=>{

      DB.raw.unshift(item);

    item.balance = Math.round((item.balance + sign*qty)*100)/100;

    DB.purchases.unshift({id:recId, date, itemId:item.id, itemName: item.name, qty, supplier, notes, kind});

/* ================= التحويلات المخزنية: إرسال + تأكيد استلام ================= */
// المرسل بيبعت الكمية ← بتتخصم من مخزنه وتبقى "في الطريق"
// المستلم بيأكد الكمية اللي وصلت فعلاً ← ساعتها بس بتتضاف لمخزنه (ولو فيه فرق بيتسجل عجز)
const ROLE_WH = { warehouse:'raw', whman:'manufacturing', whpack:'packaging', whfin:'finished' };
function myWarehouse(){ return currentUser ? (ROLE_WH[currentUser.role]||null) : null; }
function isAllWhUser(){ return currentUser && (currentUser.role==='admin' || currentUser.role==='operation'); }
function trStatus(t){ return t.status || 'received'; } // التحويلات القديمة كانت بتتنفذ فورًا
function trLines(t){ return (t.lines && t.lines.length) ? t.lines : [{fromItemId:t.fromItemId, fromItemName:t.fromItemName, fromQty:t.fromQty, toItemId:t.toItemId, toItemName:t.toItemName, toQty:t.toQty}]; }
function canReceive(t){ return trStatus(t)==='pending' && (isAllWhUser() || myWarehouse()===t.toWarehouse); }
function canCancelSend(t){ return trStatus(t)==='pending' && (isAllWhUser() || myWarehouse()===t.fromWarehouse); }
function canEditDraft(t){ return trStatus(t)==='draft' && (isAllWhUser() || myWarehouse()===t.fromWarehouse); }
function myDestinations(fromWh){
  if(isAllWhUser()) return WH_DEFS.filter(w=>w.id!=='raw' && w.id!==fromWh).map(w=>w.id);
  return (currentUser && ROLE_DEST[currentUser.role]) || [];
}
function visibleTransfers(){
  // المسودة بيشوفها المرسل بس لحد ما يسلّمها
  if(isAllWhUser()) return DB.transfers;
  const w = myWarehouse();
  return DB.transfers.filter(t=> t.fromWarehouse===w || (t.toWarehouse===w && trStatus(t)!=='draft'));
}
function pendingIncomingCount(){
  return DB.transfers.filter(t=>canReceive(t)).length;
}
const TR_STATUS = {
  draft:{label:'مسودة — لسه متسلمتش', cls:'pill-navy'},
  pending:{label:'في الطريق — مستني الاستلام', cls:'pill-warn'},
  received:{label:'تم الاستلام ✓', cls:'pill-ok'},
  rejected:{label:'مرفوض — رجع للمرسل', cls:'pill-danger'},
};

function renderTransfersTab(){
  const list = [...visibleTransfers()].sort((a,b)=>{
    const rank = t=> trStatus(t)==='draft'?0:(trStatus(t)==='pending'?1:2);
    const pa = rank(a), pb = rank(b);
    if(pa!==pb) return pa-pb;
    return (b.sentAt||b.date||'').localeCompare(a.sentAt||a.date||'');
  });
  const incoming = pendingIncomingCount();
  const canSend = isAllWhUser() || (myDestinations(myWarehouse()).length>0);
  let html = `
  ${incoming? `<div class="panel" style="padding:14px 18px;border-color:var(--warn);background:var(--warn-bg);margin-bottom:14px;display:flex;align-items:center;gap:10px;">
    ${svgIcon('alert')}<div><strong>فيه ${incoming} تحويل مستني تأكيد استلامك.</strong> راجع الكمية اللي وصلت فعلاً واضغط "تأكيد الاستلام".</div></div>` : ''}
  <div class="panel">
    <div class="panel-head">
      <h2>التحويلات المخزنية <span class="muted" style="font-weight:600;font-size:12.5px">(${list.length})</span></h2>
      <div class="toolbar">${canSend? `<button class="btn btn-gold" id="addTransferBtn">+ إرسال تحويل</button>`:''}</div>
    </div>
    <div class="panel-body">
      ${list.length? `
      <div class="table-wrap"><table>
        <thead><tr><th>تاريخ الإرسال</th><th>من</th><th>إلى</th><th>الصنف</th><th>المرسل</th><th>المستلم فعلاً</th><th>الحالة</th><th>أرسله / استلمه</th><th></th></tr></thead>
        <tbody>
        ${list.map(t=>{
          const st = TR_STATUS[trStatus(t)];
          const lines = trLines(t);
          const itemLabel = lines.map(ln=> ln.fromItemName===ln.toItemName||!ln.toItemName ? esc(ln.fromItemName) : `${esc(ln.fromItemName)} ← ${esc(ln.toItemName)}`).join('<br>');
          const sentQty = lines.map(ln=> fmtNum(ln.fromQty)+trUnitLabel(ln)).join('<br>');
          const recQty = trStatus(t)==='received' ? lines.map(ln=>{
            const r = Number(ln.toQty), s2 = Number(ln.fromQty);
            const diff = Math.round((r - s2)*100)/100;
            return `${fmtNum(r)}${trUnitLabel(ln)}${diff? ` <span style="color:var(--danger);font-size:11px;">(${diff<0?'عجز':'زيادة'} ${fmtNum(Math.abs(diff))})</span>`:''}`;
          }).join('<br>') : '—';
          const actions = [];
          if(canEditDraft(t)){
            actions.push(`<button class="btn btn-sm btn-ghost" data-act="editdraft" data-id="${t.id}">تعديل</button>`);
            actions.push(`<button class="btn btn-sm btn-primary" data-act="senddraft" data-id="${t.id}">تمام — سلّم</button>`);
            actions.push(`<button class="icon-btn danger" data-act="deldraft" data-id="${t.id}" title="حذف المسودة">${svgIcon('trash','sm')}</button>`);
          } else if(canReceive(t)){
            actions.push(`<button class="btn btn-sm btn-primary" data-act="receive" data-id="${t.id}">تأكيد الاستلام</button>`);
            actions.push(`<button class="btn btn-sm btn-ghost" data-act="reject" data-id="${t.id}">رفض</button>`);
          } else if(canCancelSend(t)){
            actions.push(`<button class="btn btn-sm btn-ghost" data-act="cancel" data-id="${t.id}">إلغاء الإرسال</button>`);
          }
          if(isAdmin && trStatus(t)!=='draft') actions.push(`<button class="icon-btn danger" data-act="delete" data-id="${t.id}" title="حذف">${svgIcon('trash','sm')}</button>`);
          return `
          <tr data-id="${t.id}">
            <td>${t.sentAt? fmtDateTimeAr(t.sentAt) : (t.draftAt? `<span class="muted">اتكتبت ${fmtDateTimeAr(t.draftAt)}</span>` : fmtDateAr(t.date))}</td>
            <td><span class="pill pill-navy">${esc(whLabel(t.fromWarehouse))}</span></td>
            <td><span class="pill pill-navy">${esc(whLabel(t.toWarehouse))}</span></td>
            <td style="font-weight:700">${itemLabel}${t.notes?`<div class="muted" style="font-size:11.5px;font-weight:500;">${esc(t.notes)}</div>`:''}</td>
            <td class="num">${sentQty}</td>
            <td class="num">${recQty}</td>
            <td><span class="pill ${st.cls}">${st.label}</span>${t.receiveNotes?`<div class="muted" style="font-size:11px;margin-top:3px;">${esc(t.receiveNotes)}</div>`:''}</td>
            <td style="font-size:12px;">${t.sentBy?`أرسل: ${esc(t.sentBy)}`:'—'}${t.receivedBy?`<br>${trStatus(t)==='rejected'?'رفض':'استلم'}: ${esc(t.receivedBy)}${t.receivedAt?` <span class="muted">(${fmtDateTimeAr(t.receivedAt)})</span>`:''}`:''}</td>
            <td><div class="btn-icon-row">${actions.join('')}</div></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>` : `<div class="empty-state">${svgIcon('history')}<div>لا يوجد تحويلات مسجلة بعد</div></div>`}
    </div>
  </div>`;
  document.getElementById('content').innerHTML = `<div class="content-fade">${html}</div>`;
  const addBtn = document.getElementById('addTransferBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>openTransferModal());
  document.querySelectorAll('[data-act="editdraft"]').forEach(b=>b.addEventListener('click', ()=>openTransferModal(null, b.dataset.id)));
  document.querySelectorAll('[data-act="senddraft"]').forEach(b=>b.addEventListener('click', ()=>{
    openConfirmModal('متأكد إن التحويل تمام؟ الكميات هتتخصم من مخزنك وتتسلم للمخزن التاني، ومش هتقدر تعدّلها بعد كده.', async ()=>{
      const t = DB.transfers.find(x=>x.id===b.dataset.id);
      if(!t || !canEditDraft(t)){ showToast('التحويل ده اتعامل معاه بالفعل'); renderTransfersTab(); return; }
      const err = finalizeTransfer(t);
      if(err){ showToast(err); return; }
      await persist(); renderTransfersTab(); renderNav();
      showToast('تم التسليم — مستني تأكيد الاستلام من المخزن التاني');
    }, 'تمام — سلّم');
  }));
  document.querySelectorAll('[data-act="deldraft"]').forEach(b=>b.addEventListener('click', ()=>{
    openConfirmModal('هل تريد حذف المسودة دي؟', async ()=>{
      DB.transfers = DB.transfers.filter(x=>x.id!==b.dataset.id);
      logAction('حذف مسودة تحويل');
      await persist(); renderTransfersTab(); renderNav();
      showToast('تم حذف المسودة');
    });
  }));
  document.querySelectorAll('[data-act="receive"]').forEach(b=>b.addEventListener('click', ()=>openReceiveModal(b.dataset.id)));
  document.querySelectorAll('[data-act="reject"]').forEach(b=>b.addEventListener('click', ()=>{
    openConfirmModal('هل تريد رفض التحويل ده؟ الكمية هترجع لمخزن المرسل.', ()=>returnTransferToSender(b.dataset.id,'rejected'), 'رفض التحويل');
  }));
  document.querySelectorAll('[data-act="cancel"]').forEach(b=>b.addEventListener('click', ()=>{
    openConfirmModal('هل تريد إلغاء التحويل ده؟ الكمية هترجع لمخزنك.', ()=>returnTransferToSender(b.dataset.id,'cancelled'), 'إلغاء الإرسال');
  }));
  document.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', ()=>{
    openConfirmModal('هل تريد حذف سجل هذا التحويل؟ هترجع الأرصدة تلقائي زي ما كانت قبل التحويل.', async ()=>{
      const t = DB.transfers.find(x=>x.id===b.dataset.id);
      if(t){
        const st = trStatus(t);
        const fromArr = whArray(t.fromWarehouse), toArr = whArray(t.toWarehouse);
        trLines(t).forEach(ln=>{
          if(st!=='rejected' && st!=='draft'){ // المرفوض رجع للمرسل أصلاً، والمسودة ماخصمتش حاجة
            const fromItem = ln.fromItemId===null ? null : (fromArr.find(i=>i.id===ln.fromItemId) || fromArr.find(i=>i.name.trim()===ln.fromItemName));
            if(fromItem){ fromItem.balance = Math.round((fromItem.balance + Number(ln.fromQty||0))*100)/100; }
          }
          if(st==='received'){
            const toItem = toArr.find(i=>i.id===ln.toItemId) || toArr.find(i=>i.name.trim()===ln.toItemName);
            if(toItem){ toItem.balance = Math.round((toItem.balance - Number(ln.toQty||0))*100)/100; }
          }
          [...fromArr, ...toArr].forEach(it=>{ if(it.history) it.history = it.history.filter(h=>h.refId!==t.id); });
        });
      }
      DB.transfers = DB.transfers.filter(x=>x.id!==b.dataset.id);
      logAction(`حذف سجل تحويل${t?` من ${whLabel(t.fromWarehouse)} إلى ${whLabel(t.toWarehouse)}`:''}`);
      await persist();
      renderTransfersTab(); renderNav();
      showToast('تم حذف السجل وترجيع الأرصدة');
    });
  }));
}

function openReceiveModal(id){
  const t = DB.transfers.find(x=>x.id===id);
  if(!t || !canReceive(t)) return;
  const lines = trLines(t);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><h3>تأكيد استلام تحويل</h3><button class="modal-close" id="closeX">✕</button></div>
        <div class="modal-body">
          <div class="muted" style="font-size:12.5px;">من <b>${esc(whLabel(t.fromWarehouse))}</b> إلى <b>${esc(whLabel(t.toWarehouse))}</b> — أرسله ${esc(t.sentBy||'—')}</div>
          ${lines.map((ln,i)=>`
            <div class="field"><label>${esc(ln.fromItemName)} — المرسل ${fmtNum(ln.fromQty)}${trUnitLabel(ln)}. الكمية اللي وصلت فعلاً *</label>
              <input type="number" step="0.01" data-rec="${i}" value="${ln.fromQty}">
            </div>`).join('')}
          <div class="field"><label>ملاحظات الاستلام (اختياري)</label><input type="text" id="f_recNotes" placeholder="مثال: شكارة مقطوعة"></div>
          <div class="muted" style="font-size:12px;">لو الكمية اللي وصلت أقل من المرسل، الفرق هيتسجل عجز ويظهر للأدمن.</div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">تأكيد الاستلام</button>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const qtys = lines.map((_,i)=> Number(document.querySelector(`[data-rec="${i}"]`).value));
    if(qtys.some(q=>Number.isNaN(q) || q<0)){ showToast('اكتب كمية صحيحة'); return; }
    const t2 = DB.transfers.find(x=>x.id===id);
    if(!t2 || trStatus(t2)!=='pending'){ closeModal(); showToast('التحويل ده اتعامل معاه بالفعل'); renderTransfersTab(); return; }
    const recNotes = document.getElementById('f_recNotes').value.trim();
    const toArr = whArray(t2.toWarehouse);
    const date = todayISO();
    const newLines = trLines(t2).map((ln,i)=>{
      const q = qtys[i];
      let toItem = toArr.find(it=>it.name.trim()===ln.fromItemName.trim());
      if(!toItem){ toItem = {id:uid(), name:ln.fromItemName, balance:0, history:[], unit:ln.unit||''}; if(t2.toWarehouse==='raw'){ Object.assign(toItem,{category:'',supplier:'',variant:'',barcode:'',notes:'',productionDate:'',expiryDate:''}); } toArr.unshift(toItem); }
      toItem.balance = Math.round((toItem.balance + q)*100)/100;
      toItem.history = toItem.history || [];
      const diff = Math.round((q - Number(ln.fromQty))*100)/100;
      toItem.history.push({date, ts:new Date().toISOString(), type:'اضافه', qty:q, notes:`استلام تحويل من ${whLabel(t2.fromWarehouse)}${ln.unit?' — '+ln.unit:''}${diff?` (${diff<0?'عجز':'زيادة'} ${fmtNum(Math.abs(diff))})`:''}${recNotes?' — '+recNotes:''}`, refId:t2.id, by:userTag()});
      return {...ln, toItemId:toItem.id, toItemName:toItem.name, toQty:q};
    });
    t2.lines = newLines;
    t2.status = 'received';
    t2.receivedBy = userTag();
    t2.receivedAt = new Date().toISOString();
    t2.receiveNotes = recNotes;
    const shortage = newLines.some(ln=>Number(ln.toQty)!==Number(ln.fromQty));
    logAction(`أكد استلام تحويل من ${whLabel(t2.fromWarehouse)} إلى ${whLabel(t2.toWarehouse)}${shortage?' — بفرق في الكمية':''}`);
    await persist();
    closeModal(); renderTransfersTab(); renderNav();
    showToast(shortage ? 'تم الاستلام — واتسجل فرق في الكمية' : 'تم تأكيد الاستلام وإضافة الكمية لمخزنك');
  });
}

async function returnTransferToSender(id, status){
  const t = DB.transfers.find(x=>x.id===id);
  if(!t || trStatus(t)!=='pending'){ showToast('التحويل ده اتعامل معاه بالفعل'); renderTransfersTab(); return; }
  const fromArr = whArray(t.fromWarehouse);
  trLines(t).forEach(ln=>{
    if(ln.fromItemId===null) return; // صنف ماكانش متسجل في مخزن المرسل — مفيش رصيد اتخصم عشان يرجع
    const it = fromArr.find(i=>i.id===ln.fromItemId) || fromArr.find(i=>i.name.trim()===ln.fromItemName);
    if(it){
      it.balance = Math.round((it.balance + Number(ln.fromQty||0))*100)/100;
      it.history = it.history || [];
      it.history.push({date:todayISO(), ts:new Date().toISOString(), type:'اضافه', qty:Number(ln.fromQty||0), notes: status==='rejected' ? `تحويل مرفوض من ${whLabel(t.toWarehouse)} — رجع` : 'إلغاء تحويل — رجع', refId:t.id, by:userTag()});
    }
  });
  if(status==='cancelled'){
    DB.transfers = DB.transfers.filter(x=>x.id!==id);
    logAction(`ألغى تحويل من ${whLabel(t.fromWarehouse)} إلى ${whLabel(t.toWarehouse)}`);
  } else {
    t.status = 'rejected';
    t.receivedBy = userTag();
    t.receivedAt = new Date().toISOString();
    logAction(`رفض تحويل من ${whLabel(t.fromWarehouse)} إلى ${whLabel(t.toWarehouse)}`);
  }
  await persist();
  renderTransfersTab(); renderNav();
  showToast(status==='rejected' ? 'تم رفض التحويل ورجعت الكمية للمرسل' : 'تم إلغاء التحويل ورجعت الكمية لمخزنك');
}

const TR_UNITS = ['كرتونة','كيس','علبة','كجم','قطعة','رول','شكارة'];
function trUnitLabel(ln){ return ln.unit ? ` ${esc(ln.unit)}` : ''; }

// تحويل المسودة لتحويل فعلي: خصم الكميات من مخزن المرسل وتحويلها لـ "في الطريق"
function finalizeTransfer(t){
  const fromArr = whArray(t.fromWarehouse);
  const totals = {};
  t.lines.forEach(ln=>{ totals[ln.fromItemName] = (totals[ln.fromItemName]||0) + Number(ln.fromQty||0); });
  for(const name in totals){
    const it = fromArr.find(i=>i.name.trim()===name.trim());
    if(it && totals[name] > Number(it.balance)) return `كمية "${name}" أكبر من الرصيد (${fmtNum(it.balance)})`;
  }
  const date = todayISO();
  t.lines = t.lines.map(ln=>{
    const it = fromArr.find(i=>i.name.trim()===ln.fromItemName.trim());
    if(it){
      it.balance = Math.round((it.balance - Number(ln.fromQty))*100)/100;
      it.history = it.history || [];
      it.history.push({date, ts:new Date().toISOString(), type:'صرف', qty:Number(ln.fromQty), notes:`تحويل إلى ${whLabel(t.toWarehouse)} (في انتظار الاستلام)${ln.unit?' — '+ln.unit:''}${t.notes?' — '+t.notes:''}`, refId:t.id, by:userTag()});
    }
    return {...ln, fromItemId: it?it.id:null};
  });
  t.status = 'pending';
  t.date = date;
  t.sentBy = userTag();
  t.sentAt = new Date().toISOString();
  logAction(`سلّم تحويل من ${whLabel(t.fromWarehouse)} إلى ${whLabel(t.toWarehouse)}: ${t.lines.map(l=>`${fmtNum(l.fromQty)}${l.unit?' '+l.unit:''} ${l.fromItemName}`).join('، ')}`);
  return null;
}

  function updateBal(row){
    const name = row.querySelector('.tr_name').value.trim();
    const it = whArray(fromWhSel.value).find(i=>i.name.trim()===name);
    row.querySelector('.tr_bal').textContent = name ? (it ? `الرصيد الحالي: ${fmtNum(it.balance)}${it.unit?' '+it.unit:''}` : 'صنف غير مسجل في المخزن ده — هيتبعت من غير خصم رصيد') : '';
  }
  function refill(){

    toWhSel.innerHTML = '<option value="">— اختر —</option>' + WH_DEFS.filter(w=>dests.includes(w.id))

  fromWhSel.addEventListener('change', refill);

  function collect(){
    const fromWh = fromWhSel.value;
    const toWh = toWhSel.value;
    const notes = document.getElementById('f_notes').value.trim();
    if(!fromWh){ showToast('اختر مخزن المصدر'); return null; }
    if(!toWh){ showToast('اختر المخزن اللي هتبعتله'); return null; }
    if(!isAllWhUser() && fromWh!==mine){ showToast('تقدر تحوّل من مخزنك بس'); return null; }
    if(!myDestinations(fromWh).includes(toWh)){ showToast('مش مسموحلك تحوّل للمخزن ده'); return null; }
    const rows = [...rowsWrap.querySelectorAll('.tr-row')].map(r=>({
      fromItemName: r.querySelector('.tr_name').value.trim(),
      fromQty: Number(r.querySelector('.tr_qty').value),
      unit: r.querySelector('.tr_unit').value.trim(),
    })).filter(r=>r.fromItemName || r.fromQty);
    if(!rows.length){ showToast('اكتب صنف وكمية'); return null; }
    for(const r of rows){
      if(!r.fromItemName){ showToast('فيه صف من غير اسم صنف'); return null; }
      if(!r.fromQty || r.fromQty<=0){ showToast(`اكتب كمية صحيحة لـ "${r.fromItemName}"`); return null; }
    }
    return {fromWh, toWh, notes, rows};
  }
  async function save(asDraft){
    const d = collect(); if(!d) return;
    let t = draft;
    if(t){
      t.toWarehouse = d.toWh; t.notes = d.notes; t.lines = d.rows;
    } else {
      t = {id:uid(), date:todayISO(), fromWarehouse:d.fromWh, toWarehouse:d.toWh, notes:d.notes, status:'draft',
           draftBy:userTag(), draftAt:new Date().toISOString(), lines:d.rows};
      DB.transfers.unshift(t);
    }
    if(asDraft){
      logAction(`${draft?'عدّل':'كتب'} مسودة تحويل من ${whLabel(d.fromWh)} إلى ${whLabel(d.toWh)}`);
    } else {
      const err = finalizeTransfer(t);
      if(err){
        // نسيبها مسودة عشان المستخدم يصلّح الكمية
        showToast(err + ' — اتحفظت كمسودة');
        await persist(); closeModal(); renderTransfersTab(); renderNav();
        return;
      }
    }
    await persist();
    closeModal();
    renderTransfersTab(); renderNav();
    showToast(asDraft ? 'اتحفظت كمسودة — تقدر تعدّلها لحد ما تدوس "تمام — سلّم"' : 'تم التسليم — مستني تأكيد الاستلام من المخزن التاني');
  }
  document.getElementById('draftBtn').addEventListener('click', ()=>save(true));
  document.getElementById('saveBtn').addEventListener('click', ()=>save(false));
}

/* ================= الهالك مربوط بالمخازن ================= */
const WASTE_WHS=['manufacturing','packaging','finished'];
function wasteWhLabels(){
  const ids = isAllWhUser()? WASTE_WHS : WASTE_WHS.filter(w=>w===myWarehouse());
  return ids.map(whLabel);
}
function wasteWhId(label){ const w=WH_DEFS.find(x=>x.label===label); return w?w.id:null; }
function wasteApply(rec){
  // تقرير الهالك بقى للمتابعة والإرسال بس — مفيش أي خصم من أرصدة المخازن
  rec.deducted=false; return;
  const whId=wasteWhId(rec.warehouse); if(!whId) return;
  const it=whArray(whId).find(i=>i.name.trim()===(rec.item||'').trim());
  const q=Number(rec.qty)||0;
  if(!it||!q){ rec.deducted=false; return; }
  it.balance=Math.round((it.balance-q)*100)/100;
  it.history=it.history||[];
  it.history.push({date:rec.date||todayISO(), ts:new Date().toISOString(), type:'صرف', qty:q, notes:`هالك${rec.wasteType?' ('+rec.wasteType+')':''}${rec.reason?' — '+rec.reason:''}`, refId:'waste_'+rec.id, by:userTag()});
  rec.deducted=true;
}
function wasteReverse(rec){
  if(!rec.deducted) return;
  const whId=wasteWhId(rec.warehouse); if(!whId) return;
  const it=whArray(whId).find(i=>(i.history||[]).some(h=>h.refId==='waste_'+rec.id));
  if(!it) return;
  it.balance=Math.round((it.balance+(Number(rec.qty)||0))*100)/100;
  it.history=it.history.filter(h=>h.refId!=='waste_'+rec.id);
  rec.deducted=false;
}

function wasteReportText(recs){
  const r0=recs[0];
  const total=recs.reduce((a,r)=>a+(Number(r.qty)||0),0);
  let t=`*تقرير هالك — EgyGulf Foods*\n📅 ${fmtDateAr(r0.date)}\n🏭 ${r0.warehouse||'—'}\n\n`;
  recs.forEach((r,i)=>{ t+=`${i+1}- ${r.item}: ${fmtNum(r.qty)}${r.wasteType?` (${r.wasteType})`:''}${r.reason?` — ${r.reason}`:''}\n`; });
  t+=`\n*الإجمالي: ${fmtNum(total)}*\nسجّله: ${userTag()}`;
  return t;
}

function shareWasteReport(key){
  const rec=DB.waste.find(w=>w.id===key);

  printWasteRecs(recs, 'تقرير هالك', `${esc(recs[0].warehouse||'—')}${whKeeper(recs[0].warehouse)?' — أمين المخزن: '+esc(whKeeper(recs[0].warehouse)):''}<br>${fmtDateAr(recs[0].date)}`);
}

/* ================= تقرير المخازن ================= */
let whReportState = {wh:null, from:'', to:'', search:''};
function histDay(h){ return (h.ts||h.date||'').slice(0,10); }
function classifyHist(h, trIds){
  const isIn = h.type==='اضافه'||h.type==='شراء';
  const isTr = (h.refId && trIds.has(h.refId)) || /تحويل|مرتجع لـ|راجع تلقائي|إرجاع/.test(h.notes||'');
  if(isTr) return isIn?'trIn':'trOut';
  if((h.refId||'').startsWith('waste_') || /^هالك/.test(h.notes||'')) return 'waste';
  if(h.type==='شراء') return 'buy';
  if(isIn) return 'add';
  return 'out';
}
function buildWhReport(whId, from, to){
  const trIds = new Set(DB.transfers.map(t=>t.id));
  let arr = whArray(whId);
  if(whId==='raw') arr = arr.filter(rawCatAllowed);
  const rows=[], log=[];
  const tot={opening:0,buy:0,add:0,out:0,waste:0,trIn:0,trOut:0,closing:0};
  const wl=whLabel(whId);
  const wasteRecs=(DB.waste||[]).filter(w=>w.warehouse===wl && (!from||(w.date||'')>=from) && (!to||(w.date||'')<=to));
  const wasteByItem={};
  wasteRecs.forEach(w=>{ const k=(w.item||'').trim(); wasteByItem[k]=(wasteByItem[k]||0)+(Number(w.qty)||0); });
  arr.forEach(it=>{
    const r={name:it.name, unit:it.unit||'', buy:0,add:0,out:0,waste:0,trIn:0,trOut:0, afterTo:0, afterFromNet:0};
    (it.history||[]).forEach(h=>{
      const d=histDay(h), q=Number(h.qty)||0, k=classifyHist(h,trIds);
      const sign=(k==='buy'||k==='add'||k==='trIn')?1:-1;
      if(from && d<from) return;
      r.afterFromNet += sign*q;
      if(to && d>to){ r.afterTo += sign*q; return; }
      r[k]+=q;
      log.push({d, ts:h.ts, item:it.name, k, q, notes:h.notes||'', by:h.by||'', refId:h.refId||''});
    });
    r.closing = Math.round(((Number(it.balance)||0) - r.afterTo)*100)/100;
    r.opening = Math.round(((Number(it.balance)||0) - r.afterFromNet)*100)/100;
    const moved = r.buy||r.add||r.out||r.waste||r.trIn||r.trOut;
    r.moved = !!moved;
    r.waste = wasteByItem[it.name.trim()]||0;
    if(r.waste) r.moved=true;
    rows.push(r);
    ['opening','buy','add','out','waste','trIn','trOut','closing'].forEach(k=>tot[k]+=r[k]);
  });
  // التحويلات حسب المخزن التاني
  const flows={}, trRows=[];
  const ST={pending:'في الطريق (لسه ماتستلمش)',received:'تم الاستلام'};
  DB.transfers.forEach(t=>{
    const st=trStatus(t); if(st==='draft'||st==='rejected') return;
    const inR=(x)=>{ const d=String(x||'').slice(0,10); return d && !((from&&d<from)||(to&&d>to)); };
    const sentOk=inR(t.sentAt||t.date), recOk=inR(t.receivedAt||t.sentAt||t.date);
    trLines(t).forEach(ln=>{
      if(t.toWarehouse===whId && st==='pending' && sentOk){
        trRows.push({ts:t.sentAt||t.date, dir:'pend', other:whLabel(t.fromWarehouse), item:ln.fromItemName||'—', qty:Number(ln.fromQty||0), toItem:'', toQty:0, status:'في الطريق — لسه ماتستلمش', by:t.sentBy, rec:''});
        return;
      }
      if(t.fromWarehouse===whId && sentOk){ const k='إلى '+whLabel(t.toWarehouse); const q=Number(ln.fromQty||0); flows[k]=(flows[k]||0)+q;
        trRows.push({ts:t.sentAt||t.date, dir:'out', other:whLabel(t.toWarehouse), item:ln.fromItemName||'—', qty:q, toItem:ln.toItemName||'', toQty:Number(ln.toQty||0), status:ST[st]||st, by:t.sentBy, rec:t.receivedBy}); }
      if(t.toWarehouse===whId && st==='received' && recOk){ const k='من '+whLabel(t.fromWarehouse); const q=Number(ln.toQty||0); flows[k]=(flows[k]||0)+q;
        trRows.push({ts:t.receivedAt||t.sentAt||t.date, dir:'in', other:whLabel(t.fromWarehouse), item:ln.toItemName||'—', qty:q, toItem:ln.fromItemName||'', toQty:Number(ln.fromQty||0), status:ST[st], by:t.sentBy, rec:t.receivedBy}); }
    });
  });
  trRows.sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));
  // التحويلات من سجل التحويلات نفسه (أدق من سجل الصنف)
  tot.trIn=0; tot.trOut=0; rows.forEach(r=>{ r.trIn=0; r.trOut=0; });
  // أي حركة تحويل في سجل الأصناف مش موجودة في سجل التحويلات (تحويلات قديمة/محذوفة)
  const seen=new Set(DB.transfers.map(t=>t.id));
  log.filter(l=>(l.k==='trIn'||l.k==='trOut') && !(l.refId && seen.has(l.refId))).forEach(l=>{
    trRows.push({ts:l.ts||l.d, dir:l.k==='trIn'?'in':'out', other:'—', item:l.item, qty:l.q, toItem:'', toQty:0, status:l.notes||'', by:l.by, rec:''});
  });
  trRows.sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));
  trRows.forEach(x=>{ if(x.dir==='pend') return; if(x.dir==='in') tot.trIn+=x.qty; else tot.trOut+=x.qty;
    const r=rows.find(r=>r.name.trim()===x.item.trim()); if(r){ if(x.dir==='in') r.trIn+=x.qty; else r.trOut+=x.qty; r.moved=true; } });
  trRows.forEach(x=>{ if(x.dir==='pend'){ const k='في الطريق من '+x.other; flows[k]=(flows[k]||0)+x.qty; } });
  log.sort((a,b)=>(b.ts||b.d).localeCompare(a.ts||a.d));
  tot.waste = wasteRecs.reduce((a,w)=>a+(Number(w.qty)||0),0);
  wasteRecs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return {rows, log:log.filter(l=>l.k!=='trIn'&&l.k!=='trOut'), tot, flows, trRows, wasteRecs, wasteByItem};
}
const WR_KLABEL={buy:['شراء','pill-ok'],add:['إضافة','pill-ok'],out:['صرف','pill-danger'],trIn:['تحويل وارد','pill-navy'],trOut:['تحويل صادر','pill-warn'],waste:['هالك','pill-danger']};

/* ================= THEME (dark/light) ================= */
const THEME_KEY = 'egygulf-foods-theme-v1';

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn) btn.innerHTML = svgIcon(theme==='dark' ? 'sun' : 'moon');
}

async function loadTheme(){
  let theme = null;
  try{
    const res = await StorageAPI.get(THEME_KEY, false);
    if(res && res.value) theme = res.value;
  }catch(e){ /* not set yet */ }
  if(!theme){
    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  applyTheme(theme);
}

async function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ await StorageAPI.set(THEME_KEY, next, false); }catch(e){ /* ignore */ }
}

/* ================= LOW STOCK NOTIFICATIONS ================= */
function updateNotifBell(){
  const bell = document.getElementById('notifBell');
  const badge = document.getElementById('notifBadge');
  if(!bell) return;
  // (re)draw the bell icon while preserving the badge element
  if(!bell.querySelector('.icon-svg')) bell.insertAdjacentHTML('afterbegin', svgIcon('bell'));

  const low = lowStockItems();
  if(low.length){
    badge.textContent = low.length > 99 ? '99+' : low.length;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  renderNotifDropdown(low);
}

function renderNotifDropdown(low){
  const dd = document.getElementById('notifDropdown');
  if(!dd) return;
  if(!low || !low.length){
    dd.innerHTML = `<div class="notif-empty">لا يوجد أصناف تحت حد الأمان حاليًا 👍</div>`;
    return;
  }
  dd.innerHTML = `
    <div class="notif-dd-head">أصناف تحت حد الأمان (${low.length})</div>
    <div class="notif-dd-list">
      ${low.map(it=>`
        <button class="notif-dd-item" data-kind="raw">
          <span class="notif-dd-name">${esc(it.name)}${it.kind?` — ${esc(it.kind)}`:''}</span>
          <span class="notif-dd-bal">${fmtNum(it.balance)}</span>
        </button>`).join('')}
    </div>
    <div class="notif-dd-foot">حد الأمان الحالي: ${fmtNum(DB.settings.lowStockThreshold)}</div>`;

  dd.querySelectorAll('.notif-dd-item').forEach(b=>{
    b.addEventListener('click', ()=>{
      closeNotifDropdown();
      setTab(b.dataset.kind);
    });
  });
}

function closeNotifDropdown(){
  const dd = document.getElementById('notifDropdown');
  if(dd) dd.classList.add('hidden');
}

function initNotifBell(){
  const bell = document.getElementById('notifBell');
  const dd = document.getElementById('notifDropdown');
  if(!bell || !dd) return;
  bell.addEventListener('click', (e)=>{
    e.stopPropagation();
    dd.classList.toggle('hidden');
  });
  document.addEventListener('click', (e)=>{
    if(!dd.classList.contains('hidden') && !e.target.closest('.notif-wrap')) closeNotifDropdown();
  });
}

        }).join('')}

      </table></div>` : `<div class="empty-state">${svgIcon('orders')}<div>لسه مفيش أوردرات مستوردة — صدّر ملف من نظام الإنتاج واستورده هنا</div></div>`}
    </div>
  </div>`;
  document.getElementById('content').innerHTML = `<div class="content-fade">${html}</div>`;
  document.querySelectorAll('[data-act="detail"]').forEach(b=>b.addEventListener('click', ()=> openExternalOrderDetail(b.dataset.id)));
  document.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', ()=>{
    const o = (DB.importedOrders||[]).find(x=>x.id===b.dataset.id);
    if(!o) return;
    if(findDispatch(o.id)){ showToast('الأوردر ده اتصرف بالفعل، متقدرش تحذفه'); return; }
    openConfirmModal(`هل تريد حذف الأوردر "${esc(o.ono||o.cust||'')}"؟`, async ()=>{
      DB.importedOrders = DB.importedOrders.filter(x=>x.id!==o.id);

      await persist();
      renderExternalOrdersTab();
      renderNav();
      showToast('تم حذف الأوردر');
    });
  }));
  const openBtn = document.getElementById('openOrderSystemBtn');
  if(openBtn){
    openBtn.addEventListener('click', ()=>{
      const url = (DB.settings && DB.settings.orderSystemUrl) || '';
      if(!url){ showToast('محتاج تحط لينك نظام الأوردرات الأول من زرار "إعدادات" فوق'); return; }
      window.open(url, '_blank');
    });

  const importFile = document.getElementById('importOrdersFile');
  if(importBtn && importFile){
    importBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          const arr = Array.isArray(data) ? data : [data];
          if(!arr.length){ showToast('الملف فاضي، مفيش أوردرات فيه'); return; }
          if(!DB.importedOrders) DB.importedOrders = [];
          let addedCount = 0, updatedCount = 0;
          arr.forEach(o=>{

            const idx = DB.importedOrders.findIndex(x=>x.id===o.id);
            if(idx>=0){ DB.importedOrders[idx] = o; updatedCount++; }

          showToast('الملف مش JSON صحيح — تأكد إنك مصدّره من نظام الأوردرات نفسه');
        }
        importFile.value = '';
      };
      reader.readAsText(file);
    });
  }
}

function openDispatchModal(order){

  if(findDispatch(order.id)){ showToast('الأوردر ده اتصرف بالفعل'); return; }
  const rows = order.rows || [];
  const finishedNames = [...new Set(DB.whFinished.map(i=>i.name))].sort((a,b)=>a.localeCompare(b,'ar'));

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:560px;max-height:85vh;overflow-y:auto;">
        <div class="modal-head"><h3>تسجيل صرف أوردر ${esc(order.ono||'')} من مخزن الإنتاج التام</h3><button class="modal-close" id="closeX">✕</button></div>
        <div class="modal-body">
          <div class="muted" style="font-size:12.5px;margin-bottom:12px;">راجع اسم الصنف والكمية لكل بند قبل الحفظ — الكمية المقترحة = عدد الوحدات × عدد الكراتين.</div>
          ${rows.map((r,idx)=>{
            const suggestedQty = (Number(r.u)||0)*(Number(r.q)||0);
            const matched = DB.whFinished.find(i=>i.name.trim()===String(r.d||'').trim());
            return `
            <div style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;">
              <div style="font-weight:700;margin-bottom:8px;">${esc(r.d||'بند بدون اسم')}</div>
              <div class="field"><label>الصنف في مخزن الإنتاج التام *</label>
                <input type="text" data-dispatch-field="itemName" data-idx="${idx}" value="${esc(matched?matched.name:(r.d||''))}" list="finList_${idx}">
                <datalist id="finList_${idx}">${finishedNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
              </div>
              <div class="field"><label>الكمية *</label><input type="number" step="0.01" data-dispatch-field="qty" data-idx="${idx}" value="${suggestedQty||''}"></div>
            </div>`;
          }).join('')}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">حفظ الصرف</button>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const lines = rows.map((r, idx)=>{
      const nameInput = document.querySelector(`[data-dispatch-field="itemName"][data-idx="${idx}"]`);
      const qtyInput = document.querySelector(`[data-dispatch-field="qty"][data-idx="${idx}"]`);
      return { productName: r.d, itemName: (nameInput.value||'').trim(), qty: Number(qtyInput.value) };
    }).filter(ln=> ln.itemName && ln.qty>0);

    if(!lines.length){ showToast('محتاج بند واحد صحيح على الأقل (اسم صنف وكمية)'); return; }

    const dispatchId = uid();
    const date = todayISO();
    const savedLines = [];
    lines.forEach(ln=>{
      let item = DB.whFinished.find(i=>i.name.trim()===ln.itemName);
      if(!item){
        item = {id:uid(), name:ln.itemName, balance:0, history:[]};
        DB.whFinished.unshift(item);
      }
      item.balance = Math.round((item.balance - ln.qty)*100)/100;
      item.history = item.history || [];
      item.history.push({date, type:'صرف', qty:ln.qty, notes:`صرف لأوردر ${order.ono||''} — العميل ${order.cust||''}`, refId: dispatchId+'_'+item.id, by: userTag()});
      savedLines.push({productName: ln.productName, itemId:item.id, itemName:item.name, qty:ln.qty});
    });

    DB.dispatches.unshift({id:dispatchId, orderId:order.id, ono:order.ono||'', cust:order.cust||'', date, lines:savedLines});
    logAction(`سجّل صرف أوردر ${order.ono||''} — العميل ${order.cust||''}`);
    await persist();
    closeModal();
    renderNav();
    openExternalOrderDetail(order.id);
    showToast('تم تسجيل الصرف وتحديث رصيد مخزن الإنتاج التام');
  });
}

/* ================= تسجيل الدخول ================= */
function byName(tag){
  if(!tag) return '';
  const un=String(tag).split(' - ').pop().trim();
  const u=(DB.users||[]).find(x=>x.username===un) || (DB.users||[]).find(x=>x.name===String(tag).trim());
  if(u && ROLE_WH[u.role]){ const wh=ROLE_WH[u.role]; return `${whKeeper(wh)} (أمين ${whLabel(wh)})`; }
  return u ? u.name : tag;
}
function userTag(){
  if(!currentUser) return '—';
  if(ROLE_WH[currentUser.role]){ const wh=ROLE_WH[currentUser.role]; return `${whKeeper(wh)} (أمين ${whLabel(wh)}) - ${currentUser.username}`; }
  return `${currentUser.name}${currentUser.username?' - '+currentUser.username:''}`;
}

function logAction(text){
  if(!DB.auditLog) DB.auditLog = [];
  DB.auditLog.unshift({
    id: uid(),
    ts: new Date().toISOString(),
    name: currentUser ? currentUser.name : '',
    username: currentUser ? currentUser.username : '',
    role: currentUser ? currentUser.role : '',
    action: text
  });
  if(DB.auditLog.length > 1000) DB.auditLog.length = 1000;
}

function showLoginScreen(){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  const passInput = document.getElementById('loginPass');
  const userInput = document.getElementById('loginUsername');
  const errBox = document.getElementById('loginError');

  const submit = ()=>{
    const username = userInput.value.trim().toLowerCase();
    const pass = passInput.value;
    if(!username || !pass){
      errBox.textContent = 'اكتب اسم المستخدم وكلمة السر';
      errBox.classList.remove('hidden');
      return;
    }
    const user = (DB.users||[]).find(u=> u.username.toLowerCase()===username);
    if(user && user.password===pass){
      currentUser = {username:user.username, role:user.role, name:user.name||user.username};
      sessionCheck(user.username, user.password).then(chk=>{
        try{ localStorage.setItem(AUTH_KEY, JSON.stringify({username:user.username, chk})); }catch(e){ /* ignore */ }
      });
      errBox.classList.add('hidden');
      passInput.value = '';
      logAction(`تسجيل دخول (${user.name||user.username})`);
      persist(true);
      enterApp();
    } else {
      errBox.textContent = 'اسم المستخدم أو كلمة السر غلط';
      errBox.classList.remove('hidden');
    }
  };
  document.getElementById('loginSubmitBtn').onclick = submit;
  [passInput, userInput].forEach(inp=>{
    inp.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  });
}

/* ================= تنبيه صوتي لطلبات القاهرة الجديدة ================= */
let knownCairoRequestIds = new Set();
let cairoPollTimer = null;

function playNotifBeep(){
  try{
    if(!window._notifAudioCtx){
      window._notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = window._notifAudioCtx;
    const fire = ()=>{
      const now = ctx.currentTime;
      const notes = [
        {freq:880,  offset:0,    dur:0.5},
        {freq:1046, offset:0.28, dur:0.5},
        {freq:1318, offset:0.56, dur:0.6},
      ];
      notes.forEach(n=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, now+n.offset);
        gain.gain.setValueAtTime(0.0001, now+n.offset);
        gain.gain.exponentialRampToValueAtTime(0.3, now+n.offset+0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+n.offset+n.dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now+n.offset);
        osc.stop(now+n.offset+n.dur+0.05);
      });
    };
    if(ctx.state==='suspended'){ ctx.resume().then(fire).catch(fire); }
    else { fire(); }
  }catch(e){ /* الصوت مش شرط أساسي، لو المتصفح رفض نتجاهل بهدوء */ }
}

let syncTimer = null;
function startCairoPolling(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(syncFromServer, 20000);
  const unlockAudio = ()=>{
    try{
      if(!window._notifAudioCtx){ window._notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(window._notifAudioCtx.state==='suspended'){ window._notifAudioCtx.resume(); }
    }catch(e){}
    document.removeEventListener('click', unlockAudio);
  };
  document.addEventListener('click', unlockAudio);
}
function stopCairoPolling(){
  if(syncTimer){ clearInterval(syncTimer); syncTimer=null; }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncFromServer(); });

function logoutUser(){
  if(currentUser){ logAction('تسجيل خروج'); persist(true); }
  currentUser = null;
  isAdmin = false;
  stopCairoPolling();
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){ /* ignore */ }
  document.getElementById('app').classList.add('hidden');
  showLoginScreen();
}

function enterApp(){
  isAdmin = (currentUser && currentUser.role==='admin');
  currentTab = firstAllowedTab();
  document.getElementById('pageTitle').textContent = TITLES[currentTab][0];
  document.getElementById('pageSub').textContent = TITLES[currentTab][1];
  renderNav();
  renderContent();
  renderAdminArea();
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  startCairoPolling();
}

/* ================= BOOT ================= */
// بصمة الجلسة: مشتقة من اسم المستخدم + كلمة السر الحالية. الصلاحية نفسها مش بتتخزن في المتصفح
// خالص — بتتقري كل مرة من قائمة المستخدمين على السيرفر. ولو كلمة السر اتغيرت الجلسة بتقع.
async function sessionCheck(username, password){
  const data = new TextEncoder().encode('egygulf|'+username+'|'+password);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showLoadError(){
  const l = document.getElementById('loading');
  l.classList.remove('hidden');
  l.innerHTML = `<div style="font-size:34px">⚠</div>
    <div style="font-weight:800;color:var(--danger);font-size:16px;">تعذر الاتصال بالسيرفر</div>
    <div class="muted" style="max-width:340px;text-align:center;font-size:13px;">تأكد إن النت شغال وحاول تاني. النظام مش هيفتح من غير اتصال عشان محدش يشتغل على داتا قديمة وتضيع.</div>
    <button class="btn btn-primary" onclick="location.reload()">إعادة المحاولة</button>`;
}

async function boot(){
  await loadTheme();
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  try{
    await loadDB();
  }catch(e){
    console.error(e);
    showLoadError();
    return;
  }
  initNotifBell();
  updateNotifBell();
  let stored = null;
  try{ stored = JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ /* ignore */ }
  const user = stored && stored.username ? (DB.users||[]).find(u=> u.username===stored.username) : null;
  let ok = false;
  if(user && stored.chk){
    try{ ok = (await sessionCheck(user.username, user.password)) === stored.chk; }catch(e){ ok=false; }
  }
  if(ok){
    currentUser = {username:user.username, role:user.role, name:user.name||user.username};
    enterApp();
  } else {
    try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
    showLoginScreen();
  }
}

document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
});
document.getElementById('sidebarBackdrop').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
});

boot();
</script>
