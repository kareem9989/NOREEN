<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EgyGulf Foods — نظام المخازن والإنتاج</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --navy:#2D2B74;
  --navy-light:#4A47A3;
  --navy-dark:#201E56;
  --sidebar-start:#2D2B74;
  --sidebar-end:#201E56;
  --gold:#FEB913;
  --gold-light:#FFD066;
  --bg:#F5F5FB;
  --card:#FFFFFF;
  --ink:#1E1D3D;
  --ink-soft:#6B698F;
  --border:#E6E5F2;
  --danger:#E0435B;
  --danger-bg:#FDEBEE;
  --warn:#FEB913;
  --warn-bg:#FFF6DF;
  --ok:#1FA97C;
  --ok-bg:#E6F7F1;
  --radius:14px;
  --shadow-card:0 1px 2px rgba(32,30,86,0.04);
  --tint:#EDECFA;
  --tint-strong:#E2E0F7;
  --gold-tint:#FFF3D6;
  --row-hover:#FAFAFE;
  --ring-track:#EEEDF7;
  --danger-hover:#fbd8de;
}
html[data-theme="dark"]{
  --navy:#8683FF;
  --navy-light:#A5A2FF;
  --navy-dark:#0E0D1F;
  --gold:#FFC94D;
  --gold-light:#FFDA85;
  --bg:#121122;
  --card:#1B1A2E;
  --ink:#EDEDF7;
  --ink-soft:#9B98BE;
  --border:#312F4C;
  --danger:#FF6B82;
  --danger-bg:#3A1E27;
  --warn:#FFC94D;
  --warn-bg:#3A311A;
  --ok:#3FD99B;
  --ok-bg:#173328;
  --shadow-card:0 1px 2px rgba(0,0,0,0.25);
  --tint:#28264A;
  --tint-strong:#332F5C;
  --gold-tint:#3A311A;
  --row-hover:#211F3A;
  --ring-track:#2A2850;
  --danger-hover:#4A2530;
}
html, body{
  overflow-x:hidden;
  width:100%;
  max-width:100vw;
}
html, body{ transition: background-color .2s ease, color .2s ease; }
*{transition: background-color .15s ease, border-color .15s ease, color .15s ease;}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  font-size:14px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select{font-family:inherit;}

/* Layout */
.app{display:flex;min-height:100vh;overflow-x:hidden;max-width:100vw;}
.sidebar{
  width:250px;flex-shrink:0;
  background:linear-gradient(180deg,var(--sidebar-start) 0%, var(--sidebar-end) 100%);
  color:#fff;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-logo{
  padding:20px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;
}
.sidebar-logo .logo-plate{
  background:#fff;border-radius:12px;padding:12px 16px;width:100%;
  display:flex;align-items:center;justify-content:center;
}
.sidebar-logo img{width:100%;max-width:160px;display:block;}
.nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:10px;
  color:rgba(255,255,255,0.72);
  font-weight:600;font-size:13.5px;
  transition:all .15s ease;
  text-align:right;width:100%;
}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item.active{background:var(--gold);color:var(--navy-dark);}
.nav-item .ic{width:18px;text-align:center;font-size:15px;}
.sidebar-foot{
  padding:14px 18px;font-size:11.5px;color:rgba(255,255,255,0.45);
  border-top:1px solid rgba(255,255,255,0.12);
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;font-weight:800;color:var(--navy);}
.topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.save-indicator{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
.save-dot.saving{background:var(--gold);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.content{padding:24px 28px 60px;flex:1;}
.hidden{display:none !important;}

/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px;
}
.stat-card .label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
.stat-card .value{font-size:26px;font-weight:800;color:var(--navy);}
.stat-card .value.alert{color:var(--danger);}
.stat-card .foot{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

.panel{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px;
}
.panel-head{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.panel-head h2{font-size:15.5px;font-weight:800;color:var(--navy);}
.panel-body{padding:6px 0;}
.panel-body.pad{padding:18px 20px;}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.search-box{
  border:1px solid var(--border);border-radius:9px;padding:8px 12px;
  font-size:13px;min-width:200px;background:var(--bg);
}
.search-box:focus{outline:2px solid var(--gold);outline-offset:-1px;}
select.filter-box{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px;background:var(--bg);}

.btn{
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-light);}
.btn-gold{background:var(--gold);color:var(--navy-dark);}
.btn-gold:hover{background:var(--gold-light);}
.btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--tint-strong);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:var(--danger-hover);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

/* table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:right;padding:10px 16px;background:var(--bg);
  color:var(--ink-soft);font-weight:700;font-size:12px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--row-hover);}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill-ok{background:var(--ok-bg);color:var(--ok);}
.pill-warn{background:var(--warn-bg);color:#9A7000;}
.pill-danger{background:var(--danger-bg);color:var(--danger);}
.pill-navy{background:var(--tint);color:var(--navy);}
.muted{color:var(--ink-soft);}
.num{font-variant-numeric:tabular-nums;font-weight:700;}
.row-actions{display:flex;gap:6px;}
.icon-btn{
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--ink-soft);font-size:13px;
}
.icon-btn:hover{background:var(--tint-strong);color:var(--navy);}
.icon-btn.danger:hover{background:var(--danger-bg);color:var(--danger);}
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .big{font-size:32px;margin-bottom:10px;}

/* production: grouped by order */
tr.group-row{cursor:pointer;background:var(--tint);}
tr.group-row:hover{background:var(--tint-strong);}
tr.group-row.selected{background:var(--gold-tint);}
tr.group-row.selected:hover{background:var(--gold-tint);}
tr.group-row td{padding:0;border-bottom:1px solid var(--border);}
.group-row-inner{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;}
.group-check{
  width:16px;height:16px;border-radius:5px;border:2px solid var(--ink-soft);flex-shrink:0;
  display:inline-block;position:relative;
}
.group-check.checked{border-color:var(--gold);background:var(--gold);}
.group-check.checked::after{
  content:'';position:absolute;left:3px;top:0px;width:4px;height:8px;
  border:solid var(--navy-dark);border-width:0 2px 2px 0;transform:rotate(45deg);
}
.group-toggle{
  width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:var(--card);color:var(--navy);flex-shrink:0;transition:transform .18s ease;
}
.group-row.expanded .group-toggle{transform:rotate(180deg);}
.group-order-badge{
  font-weight:800;color:var(--navy);background:var(--card);padding:4px 12px;border-radius:20px;font-size:13px;
}
.group-date{font-weight:700;color:var(--ink);font-size:13px;}
.group-meta{color:var(--ink-soft);font-size:12.5px;margin-inline-end:auto;}
.group-add{white-space:nowrap;}
tr.detail-row td{background:var(--card);}
tr.detail-row td:first-child{position:relative;}
tr.detail-row.dim td{color:var(--ink-soft);}
.export-scope-pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--gold-tint);color:#9A7000;
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;
}
.export-scope-pill button{
  color:#9A7000;font-size:13px;line-height:1;width:16px;height:16px;display:flex;align-items:center;justify-content:center;
}
.export-scope-pill button:hover{color:var(--danger);}

/* production summary breakdown bars */
.order-breakdown-list{display:flex;flex-direction:column;gap:10px;}
.order-breakdown-row{display:flex;align-items:center;gap:12px;}
.ob-name{
  width:110px;flex-shrink:0;font-weight:700;font-size:12.5px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ob-bar-track{flex:1;height:10px;border-radius:6px;background:var(--tint);overflow:hidden;}
.ob-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.ob-value{width:150px;flex-shrink:0;text-align:left;font-weight:800;font-size:13px;color:var(--navy);white-space:nowrap;}

/* print report (production PDF) */
#printArea{display:none;}
#printArea .pr-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #2D2B74;padding-bottom:14px;margin-bottom:18px;}
#printArea .pr-brand{font-size:22px;font-weight:800;color:#2D2B74;}
#printArea .pr-brand span{color:#FEB913;}
#printArea .pr-title{font-size:15px;font-weight:700;color:#1E1D3D;margin-top:4px;}
#printArea .pr-meta{text-align:left;font-size:11.5px;color:#6B698F;line-height:1.6;}
#printArea table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
#printArea th{background:#EDECFA;color:#2D2B74;padding:8px 10px;text-align:right;border:1px solid #E6E5F2;font-weight:700;}
#printArea td{padding:7px 10px;border:1px solid #E6E5F2;text-align:right;}
#printArea tfoot td{font-weight:800;background:#FFF3D6;}
#printArea .pr-groupline td{background:#F5F5FB;font-weight:800;color:#2D2B74;}
#printArea .pr-foot{margin-top:18px;font-size:10.5px;color:#9B98BE;text-align:center;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;right:0;left:0;padding:16px;}
  @page{margin:14mm;}
}

/* quick adjust */
.qty-adjust{display:flex;align-items:center;gap:5px;}
.qty-adjust input{width:64px;border:1px solid var(--border);border-radius:7px;padding:5px 7px;font-size:12.5px;text-align:center;}
.qty-adjust .btn-sm{padding:5px 9px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(30,29,61,0.55);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal{
  background:var(--card);border-radius:16px;width:100%;max-width:440px;
  max-height:90vh;overflow-y:auto;
}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;font-weight:800;color:var(--navy);}
.modal-close{font-size:18px;color:var(--ink-soft);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--bg);}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;background:var(--bg);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;background:var(--card);}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--navy-dark);color:#fff;padding:12px 22px;border-radius:10px;
  font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;bottom:30px;}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}

/* low stock threshold control */
.threshold-box{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
.threshold-box input{width:56px;border:1px solid var(--border);border-radius:7px;padding:5px 8px;text-align:center;}

.loading-screen{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:500;
}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--gold);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.badge-count{background:rgba(255,255,255,0.15);padding:1px 8px;border-radius:20px;font-size:11px;margin-right:auto;}
.nav-item.active .badge-count{background:rgba(32,30,86,0.15);}

@media (max-width:900px){
  .sidebar{position:fixed;right:0;top:0;bottom:0;z-index:80;transform:translateX(100%);transition:.2s;visibility:hidden;}
  .sidebar.open{transform:translateX(0);visibility:visible;}
  .menu-toggle{position:relative;z-index:90;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:75;}
  .sidebar-backdrop.show{display:block;}
  .menu-toggle{display:flex !important;}
  .content{padding:18px 14px 60px;}
  .topbar{padding:14px 16px;}
}
.menu-toggle{display:none;width:36px;height:36px;border-radius:9px;background:var(--bg);align-items:center;justify-content:center;font-size:16px;}
.theme-toggle{
  width:36px;height:36px;border-radius:9px;background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--navy);
}
.theme-toggle:hover{background:var(--tint);}
.theme-toggle .icon-svg{width:17px;height:17px;}

/* notification bell */
.notif-wrap{position:relative;}
.notif-bell{
  width:36px;height:36px;border-radius:9px;background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--navy);position:relative;
}
.notif-bell:hover{background:var(--tint);}
.notif-bell .icon-svg{width:17px;height:17px;}
.notif-badge{
  position:absolute;top:-5px;left:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--card);
}
.notif-dropdown{
  position:absolute;top:44px;left:0;width:300px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;box-shadow:0 12px 28px rgba(32,30,86,0.14);z-index:50;overflow:hidden;
}
.notif-dd-head{padding:12px 14px;font-weight:800;font-size:13px;color:var(--navy);border-bottom:1px solid var(--border);}
.notif-dd-list{max-height:280px;overflow-y:auto;}
.notif-dd-item{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--border);text-align:right;font-size:12.5px;
}
.notif-dd-item:hover{background:var(--row-hover);}
.notif-dd-item:last-child{border-bottom:none;}
.notif-dd-name{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notif-dd-bal{color:var(--danger);font-weight:800;flex-shrink:0;}
.notif-dd-foot{padding:9px 14px;font-size:11px;color:var(--ink-soft);background:var(--bg);}
.notif-empty{padding:20px 14px;text-align:center;font-size:12.5px;color:var(--ink-soft);}

/* ============ v2 additions ============ */
.icon-svg{width:17px;height:17px;flex-shrink:0;}
.icon-svg.sm{width:14px;height:14px;}
.nav-item .icon-svg{stroke:currentColor;}
.stat-card{position:relative;overflow:hidden;transition:transform .18s ease, box-shadow .18s ease;}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(45,43,116,0.09);}
.stat-card .icon-wrap{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;background:var(--tint);color:var(--navy);
}
.stat-card .icon-wrap.gold{background:var(--gold-tint);color:#9A7000;}
.stat-card .icon-wrap.danger{background:var(--danger-bg);color:var(--danger);}
.stat-card .icon-wrap.ok{background:var(--ok-bg);color:var(--ok);}
.stat-card .trend{position:absolute;left:16px;top:18px;font-size:11px;font-weight:700;}

.content-fade{animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.charts-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px;}
@media (max-width:1000px){.charts-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.chart-card h3{font-size:14.5px;font-weight:800;color:var(--navy);margin-bottom:14px;}
.chart-card .chart-holder{position:relative;height:230px;}
.chart-empty{height:230px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;}

.kpi-ring-card{display:flex;align-items:center;gap:16px;}
.kpi-ring-wrap{position:relative;width:96px;height:96px;flex-shrink:0;}
.kpi-ring-wrap .kpi-center{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-weight:800;
}
.kpi-ring-wrap .kpi-center .pct{font-size:19px;color:var(--navy);}
.kpi-ring-wrap .kpi-center .pct-label{font-size:9.5px;color:var(--ink-soft);font-weight:600;}

.order-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
.order-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;transition:.15s;
}
.order-card:hover{border-color:var(--gold);box-shadow:0 8px 20px rgba(254,185,19,0.15);}
.order-card.active{border-color:var(--navy);background:var(--tint);}
.order-card .oc-name{font-weight:800;font-size:14.5px;color:var(--navy);margin-bottom:6px;}
.order-card .oc-total{font-size:22px;font-weight:800;color:var(--ink);}
.order-card .oc-foot{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

.date-range{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.date-range input{border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12.5px;background:var(--bg);}

.drawer-overlay{position:fixed;inset:0;background:rgba(30,29,61,0.5);z-index:110;}
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(420px,92vw);
  background:var(--card);z-index:111;box-shadow:8px 0 30px rgba(0,0,0,0.15);
  display:flex;flex-direction:column;animation:slideIn .22s ease;
}
@keyframes slideIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.drawer-head h3{font-size:16.5px;font-weight:800;color:var(--navy);}
.drawer-head .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.drawer-body{padding:18px 22px;flex:1;overflow-y:auto;}
.timeline{display:flex;flex-direction:column;}
.timeline-item{display:flex;gap:12px;padding-bottom:18px;position:relative;}
.timeline-item:not(:last-child)::before{
  content:'';position:absolute;right:5.5px;top:20px;bottom:0;width:1.5px;background:var(--border);
}
.timeline-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.timeline-dot.in{background:var(--ok);}
.timeline-dot.out{background:var(--danger);}
.timeline-content{flex:1;}
.timeline-content .row1{display:flex;justify-content:space-between;font-weight:700;font-size:13px;}
.timeline-content .date{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.btn-icon-row{display:flex;gap:6px;}

.filter-summary{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.empty-state .icon-svg{width:34px;height:34px;color:var(--ink-soft);opacity:.45;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;}

/* ============ RESPONSIVE: TABLET (900px وأقل - أصلاً موجود) + هنا تحسينات إضافية ============ */
@media (max-width:900px){
  .cards-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .stat-card{padding:14px;}
  .stat-card .value{font-size:22px;}
  .panel-head{padding:14px 16px;}
  .panel-body.pad{padding:16px;}
  table{font-size:12.5px;}
  thead th{padding:9px 12px;}
  tbody td{padding:9px 12px;}
  .modal{max-width:94vw !important;}
  .modal-body{padding:16px 18px;gap:12px;}
  .modal-head{padding:14px 18px;}
  .modal-foot{padding:12px 18px;}
}

/* ============ RESPONSIVE: MOBILE (640px وأقل) ============ */
@media (max-width:640px){
  html{font-size:14px;}
  body{font-size:13px;}
  .content{padding:14px 10px 60px;}
  .topbar{padding:12px 12px;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:16px;}
  .topbar .sub{font-size:11px;}
  .topbar-right{gap:6px;flex-wrap:wrap;}
  .theme-toggle,.notif-bell{width:32px;height:32px;}

  .cards-grid{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .stat-card{padding:12px;}
  .stat-card .label{font-size:11px;}
  .stat-card .value{font-size:18px;}
  .stat-card .icon-wrap{width:30px;height:30px;margin-bottom:8px;}

  .panel{margin-bottom:14px;border-radius:12px;}
  .panel-head{padding:12px 14px;flex-direction:column;align-items:flex-start;gap:8px;}
  .panel-head h2{font-size:14px;}
  .toolbar{width:100%;}
  .toolbar .btn{flex:1;justify-content:center;}
  .search-box{min-width:0;flex:1;}

  /* الجداول: نخليها تتمرر أفقيًا بسهولة على الموبايل بدل ما تتكسر */
  .table-wrap{-webkit-overflow-scrolling:touch;}
  table{font-size:12px;}
  thead th{padding:8px 10px;font-size:11px;}
  tbody td{padding:8px 10px;}
  .pill{font-size:10.5px;padding:2px 8px;}
  .btn{padding:8px 12px;font-size:12.5px;}
  .btn-sm{padding:5px 8px;font-size:11px;}
  .icon-btn{width:26px;height:26px;}

  /* المودالات */
  .modal-overlay{padding:10px;align-items:flex-end;}
  .modal{max-width:100% !important;width:100%;border-radius:16px 16px 0 0;max-height:92vh;}
  .modal-head h3{font-size:14.5px;}
  .modal-body{padding:14px 16px;gap:12px;}
  .field input,.field select,.field textarea{padding:9px 10px;font-size:13px;}
  .modal-foot{padding:12px 16px;flex-direction:column-reverse;}
  .modal-foot .btn{width:100%;justify-content:center;}

  /* صفوف منتجات طلبات القاهرة: تترص عمودي بدل صف واحد ضيق */
  .cr-product-row{flex-wrap:wrap;}
  .cr-product-row .field{flex:1 1 100% !important;min-width:0;}
  .cr-product-row .cr-remove-row{margin-right:auto;}

  .charts-grid{gap:10px;margin-bottom:14px;}
  .chart-card{padding:14px;}
  .chart-card h3{font-size:13px;}

  .group-row-inner{padding:10px 12px;gap:8px;}
  .order-breakdown-row{flex-wrap:wrap;gap:6px;}
  .ob-name{width:auto;flex:1;}
  .ob-value{width:auto;}

  /* شاشة تسجيل الدخول */
  #loginScreen .panel{padding:22px 18px !important;max-width:100% !important;}

  .notif-dropdown{position:fixed;top:64px;left:10px;right:10px;width:auto;max-width:none;max-height:70vh;overflow-y:auto;z-index:65;}
  .notif-dd-list{max-height:50vh;}
}

/* ============ RESPONSIVE: LAPTOP/DESKTOP (فوق 1400px) — استغلال المساحة الفاضية ============ */

}

/* ================= تخزين مقسّم لكل مجموعة بيانات في مستند مستقل ================= */
/* كل مجموعة (خامات، إنتاج، هالك، مشتريات...) بتتخزن في مستند Firestore منفصل بدل
   ما يكونوا كلهم في مستند واحد ضخم. ده بيمنع إن حفظ أي حاجة يمسح تعديلات حد تاني
   بعمل حاجة مختلفة تمامًا في نفس الوقت. كمان كل حفظ بيعمل "دمج" مع آخر نسخة على
   السيرفر بدل الكتابة فوقها بالكامل، عشان لو حد تاني ضاف صنف جديد من وقت ما حمّلنا
   إحنا الصفحة، الصنف ده ميتمسحش. */
const DB_KEYS = ['settings','users','raw','production','waste','breakdowns','purchases','purchaseRequests','whManufacturing','whPackaging','whFinished','transfers','dispatches','importedOrders','suppliers','itemCard','auditLog','knownUsers','cairoRequests','fillingReports','productionReports'];
function collKey(k){ return STORAGE_KEY + '__' + k; }
let LOCAL_SNAPSHOT = {}; // key -> آخر نسخة متفق عليها مع السيرفر (JSON للمجموعة كلها)
let ITEM_SNAPSHOT = {};  // key -> Map(id -> JSON لكل صنف) من آخر نسخة متفق عليها مع السيرفر
const MAX_ITEM_HISTORY = 300; // أقصى عدد حركات محفوظة لكل صنف (عشان المستند ميعديش حد Firestore 1MB)
const DOC_WARN_BYTES = 850*1024;

function takeSnapshot(k){
  LOCAL_SNAPSHOT[k] = JSON.stringify(DB[k]);
  if(Array.isArray(DB[k])){
    const m = new Map();
    DB[k].forEach(it=>{ if(it && it.id) m.set(it.id, JSON.stringify(it)); });
    ITEM_SNAPSHOT[k] = m;
  } else {
    ITEM_SNAPSHOT[k] = null;
  }
}

// دمج على مستوى الصنف الواحد:
// - الأصناف اللي إحنا عدّلناها/ضفناها محليًا => نسختنا هي اللي بتتحفظ
// - الأصناف اللي إحنا حذفناها محليًا => بتتحذف
// - أي حاجة تانية (تعديل/إضافة/حذف عملها حد تاني) => نسخة السيرفر هي اللي بتفضل
function mergeCollection(key, localVal, serverVal){
  if(!Array.isArray(localVal)){
    // settings: دمج على مستوى المفتاح — المفاتيح اللي إحنا غيرناها بس هي اللي بتكتب فوق السيرفر
    if(localVal && typeof localVal==='object' && serverVal && typeof serverVal==='object'){
      let base = {};
      try{ base = JSON.parse(LOCAL_SNAPSHOT[key]||'{}')||{}; }catch(e){}
      const out = {...serverVal};
      Object.keys(localVal).forEach(k=>{
        if(JSON.stringify(localVal[k])!==JSON.stringify(base[k])) out[k]=localVal[k];
      });
      Object.keys(base).forEach(k=>{ if(!(k in localVal)) delete out[k]; });
      return out;
    }
    return localVal;
  }
  const server = Array.isArray(serverVal) ? serverVal : [];
  const snap = ITEM_SNAPSHOT[key] || new Map();
  const localMap = new Map();
  localVal.forEach(it=>{ if(it && it.id) localMap.set(it.id, it); });

  const changed = new Map(); // id -> local item (اتعدل أو اتضاف عندنا)
  localVal.forEach(it=>{
    if(!it || !it.id) return;
    const before = snap.get(it.id);
    if(before===undefined || before!==JSON.stringify(it)) changed.set(it.id, it);
  });
  const deletedLocally = new Set();
  snap.forEach((_,id)=>{ if(!localMap.has(id)) deletedLocally.add(id); });

  const serverIds = new Set();
  const merged = [];
  server.forEach(sv=>{
    if(!sv || !sv.id){ merged.push(sv); return; }
    serverIds.add(sv.id);
    if(deletedLocally.has(sv.id)) return;
    merged.push(changed.has(sv.id) ? changed.get(sv.id) : sv);
  });
  // أصناف جديدة عندنا (أو اتعدلت عندنا بعد ما حد تاني حذفها — بنحتفظ بتعديلنا)
  const newOnes = [];
  localVal.forEach(it=>{
    if(it && it.id && !serverIds.has(it.id) && changed.has(it.id)) newOnes.push(it);
  });
  // الأصناف الجديدة بتتحط في نفس ترتيبها المحلي (غالبًا فوق)
  return newOnes.concat(merged);
}

function trimHistories(){
  ['raw','whManufacturing','whPackaging','whFinished','suppliers'].forEach(k=>{
    (DB[k]||[]).forEach(it=>{
      if(Array.isArray(it.history) && it.history.length>MAX_ITEM_HISTORY){
        it.history = it.history.slice(-MAX_ITEM_HISTORY);
      }
    });
  });
}

async function loadDB(){
  // لو القراءة من السيرفر فشلت (نت/Firebase) بنرمي الخطأ لفوق — مش بنبدأ بداتا فاضية
  // عشان ده كان ممكن يكتب داتا تجريبية فوق الداتا الحقيقية
  const results = await Promise.all(DB_KEYS.map(k=>StorageAPI.get(collKey(k))));
  const anyFound = results.some(r=>r && r.value);
  if(anyFound){
    DB = {};
    DB_KEYS.forEach((k,i)=>{
      const r = results[i];
      DB[k] = (r && r.value) ? JSON.parse(r.value) : (k==='settings' ? {} : []);
      // الـ snapshot = اللي على السيرفر فعلاً (قبل الترحيلات) عشان أي ترحيل يتحفظ صح
      LOCAL_SNAPSHOT[k] = JSON.stringify(DB[k]);
      const m = new Map();
      if(Array.isArray(DB[k])) DB[k].forEach(it=>{ if(it && it.id) m.set(it.id, JSON.stringify(it)); });
      ITEM_SNAPSHOT[k] = Array.isArray(DB[k]) ? m : null;
    });
    applyDBDefaultsAndMigrations();
    await persist(true);
    return;
  }
  const legacy = await StorageAPI.get(STORAGE_KEY);
  if(legacy && legacy.value){
    DB = JSON.parse(legacy.value);
    applyDBDefaultsAndMigrations();
    DB_KEYS.forEach(k=>{ if(DB[k]===undefined) DB[k] = (k==='settings'?{}:[]); });
    await persist(true);
    return;
  }
  // السيرفر شغال فعلاً ومفيهوش أي داتا => أول تشغيل
  DB = freshDB();
  await persist(true);
}

/* ---------- الحفظ: طابور واحد، ومفيش أي حفظ بيعلّق ---------- */
let persistWaiters = [];
let saveChain = Promise.resolve();
let isSaving = false;
let saveFailed = false;
let retryTimer = null;

function setSaveUI(state){
  const dot = document.getElementById('saveDot');
  const txt = document.getElementById('saveText');
  if(!dot||!txt) return;
  dot.classList.toggle('saving', state==='saving');
  dot.style.background = state==='error' ? 'var(--danger)' : '';
  txt.style.color = state==='error' ? 'var(--danger)' : '';
  txt.textContent = state==='saving' ? 'جارِ الحفظ…' : (state==='error' ? '⚠ لم يتم الحفظ — جارِ إعادة المحاولة' : 'محفوظ');
}

async function doSaveAll(){
  trimHistories();
  const failures = [];
  await Promise.all(DB_KEYS.map(async (k)=>{
    const localJson = JSON.stringify(DB[k]);
    if(LOCAL_SNAPSHOT[k] === localJson) return;
    try{
      const r = await StorageAPI.get(collKey(k));
      const serverVal = (r && r.value) ? JSON.parse(r.value) : null;
      const merged = mergeCollection(k, DB[k], serverVal);
      const out = JSON.stringify(merged);
      if(out.length > DOC_WARN_BYTES) console.warn('حجم مستند', k, 'قرب من الحد:', out.length);
      await StorageAPI.set(collKey(k), out);
      // لو المستخدم عدّل حاجة تانية أثناء الحفظ، منمسحهاش: بندمج تاني بعد الحفظ
      const localNow = JSON.stringify(DB[k]);
      if(localNow === localJson){
        DB[k] = merged;
        takeSnapshot(k);
      } else {
        const savedArr = merged;
        // نخلي الـ snapshot = اللي اتحفظ فعلاً، والتعديلات الجديدة تتحفظ في الدورة الجاية
        DB[k] = mergeCollectionAfterSave(k, DB[k], savedArr, localJson);
        LOCAL_SNAPSHOT[k] = out;
        const m = new Map();
        if(Array.isArray(savedArr)) savedArr.forEach(it=>{ if(it && it.id) m.set(it.id, JSON.stringify(it)); });
        ITEM_SNAPSHOT[k] = Array.isArray(savedArr) ? m : null;
      }
    }catch(e){
      console.error('فشل حفظ', k, e);
      failures.push(k);
    }
  }));
  if(failures.length) throw new Error('SAVE_FAILED:'+failures.join(','));
}

// بعد الحفظ، لو فيه تعديلات محلية حصلت أثناء الحفظ: ناخد نسخة السيرفر ونرجّع عليها تعديلاتنا الجديدة بس
function mergeCollectionAfterSave(k, localNowArr, savedArr, localAtSaveJson){
  if(!Array.isArray(localNowArr)) return localNowArr;
  let atSave=[]; try{ atSave=JSON.parse(localAtSaveJson)||[]; }catch(e){}
  const atSaveMap = new Map(atSave.map(it=>[it.id, JSON.stringify(it)]));
  const nowMap = new Map(localNowArr.map(it=>[it.id, it]));
  const out = [];
  const seen = new Set();
  localNowArr.forEach(it=>{ if(!atSaveMap.has(it.id)){ out.push(it); seen.add(it.id);} }); // جديد أثناء الحفظ
  savedArr.forEach(sv=>{
    if(!sv || !sv.id){ out.push(sv); return; }
    if(seen.has(sv.id)) return;
    if(atSaveMap.has(sv.id) && !nowMap.has(sv.id)) return; // اتحذف أثناء الحفظ
    const cur = nowMap.get(sv.id);
    if(cur && atSaveMap.get(sv.id)!==JSON.stringify(cur)) out.push(cur); else out.push(sv);
  });
  return out;
}

function persist(silent){
  if(!silent) setSaveUI('saving');
  return new Promise((resolve)=>{
    persistWaiters.push(resolve);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      saveTimer = null;
      const waiters = persistWaiters;
      persistWaiters = [];
      saveChain = saveChain.then(async ()=>{
        isSaving = true;
        try{
          await doSaveAll();
          saveFailed = false;
          setSaveUI('ok');
        }catch(e){
          saveFailed = true;
          setSaveUI('error');
          showToast('⚠ الحفظ على السيرفر فشل (تأكد من النت) — هنعيد المحاولة تلقائي');
          clearTimeout(retryTimer);
          retryTimer = setTimeout(()=>persist(true), 15000);
        }finally{
          isSaving = false;
          waiters.forEach(r=>r());
        }
      });
    }, silent?0:250);
  });
}

function hasPendingLocalChanges(){
  return DB_KEYS.some(k=> LOCAL_SNAPSHOT[k] !== JSON.stringify(DB[k]));
}
function userIsBusy(){
  const a = document.activeElement;
  const typing = a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
  const modalOpen = !!document.querySelector('#modalRoot .modal-overlay, #drawerRoot .drawer');
  return typing || modalOpen;

async function syncFromServer(){
  if(!DB || !currentUser) return;
  if(saveTimer || isSaving || saveFailed) return;
  if(hasPendingLocalChanges()) return;
  let changedAny = false;
  const newCairo = [];
  const prevReceivable = new Set((DB.transfers||[]).filter(t=>canReceive(t)).map(t=>t.id));
  try{
    const results = await Promise.all(DB_KEYS.map(k=>StorageAPI.get(collKey(k))));
    if(saveTimer || isSaving || hasPendingLocalChanges()) return; // المستخدم عمل حاجة أثناء التحميل
    DB_KEYS.forEach((k,i)=>{
      const r = results[i];
      if(!r || !r.value) return;
      if(r.value === LOCAL_SNAPSHOT[k]) return;
      const val = JSON.parse(r.value);
      if(k==='cairoRequests' && Array.isArray(val)){
        const known = new Set((DB.cairoRequests||[]).map(x=>x.id));
        val.forEach(x=>{ if(!known.has(x.id)) newCairo.push(x); });
      }
      DB[k] = val;
      takeSnapshot(k);
      changedAny = true;
    });
  }catch(e){ return; }
  if(!changedAny) return;
  // التحقق من إن المستخدم الحالي لسه موجود وصلاحيته زي ما هي
  const u = (DB.users||[]).find(x=>x.username===currentUser.username);
  if(!u){ logoutUser(); return; }
  if(u.role!==currentUser.role){ currentUser.role=u.role; isAdmin = u.role==='admin'; renderAdminArea(); }
  const myIncoming = (DB.transfers||[]).filter(t=>canReceive(t) && !prevReceivable.has(t.id));
  if(myIncoming.length){
    playNotifBeep();
    showToast(`📦 وصلك ${myIncoming.length===1?'تحويل جديد':myIncoming.length+' تحويلات جديدة'} — أكد الاستلام`);
  }
  if(newCairo.length && currentUser.role!=='cairo' && isTabAllowed('cairoRequests')){
    playNotifBeep();
    const label = newCairo.length===1 ? (CR_TYPE_LABEL[newCairo[0].type]?CR_TYPE_LABEL[newCairo[0].type].label:'طلب') : `${newCairo.length} طلبات`;
    showToast(`📩 طلب جديد من القاهرة (${label})`);
  }
  renderNav();
  if(!userIsBusy()){
    if(!isTabAllowed(currentTab)) setTab(firstAllowedTab());
    else refreshCurrentTabKeepingFilters();
  }
}
function refreshCurrentTabKeepingFilters(){

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtNum(n){
  if(n===null||n===undefined||n==='') return '—';
  n = Number(n);
  if(Number.isNaN(n)) return '—';
  return n.toLocaleString('en-US',{maximumFractionDigits:2});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDateAr(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(Number.isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateTimeAr(ts){
  if(!ts) return '—';
  const dt = new Date(ts);
  if(Number.isNaN(dt.getTime())) return ts;
  const datePart = dt.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});
  const timePart = dt.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true});
  return `${datePart} — ${timePart}`;
}
function showToast(msg){

function totalMinutes(from,to){
  if(!from||!to) return 0;
  const [fh,fm]=from.split(':').map(Number), [th,tm]=to.split(':').map(Number);
  if([fh,fm,th,tm].some(isNaN)) return 0;
  let mins=(th*60+tm)-(fh*60+fm);
  if(mins<0) mins+=24*60;
  return mins;
}

/* Pure CSS conic-gradient donut chart — no external library, always renders. */
function htmlDonutChart(segments, size){
  size = size || 150;
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(total <= 0){
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--ring-track);margin:0 auto;"></div>`;
  }
  let cumulative = 0;
  const stops = segments.map(seg=>{
    const start = (cumulative/total*360).toFixed(2);
    cumulative += seg.value;
    const end = (cumulative/total*360).toFixed(2);
    return `${seg.color} ${start}deg ${end}deg`;
  }).join(', ');
  const thickness = Math.round(size*0.28);
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops});margin:0 auto;display:flex;align-items:center;justify-content:center;">
    <div style="width:${size-thickness*2}px;height:${size-thickness*2}px;border-radius:50%;background:var(--card);"></div>
  </div>`;
}

function donutLegend(segments){

/* Pure CSS ring gauge for a single percentage (efficiency KPI) — no external library. */
function htmlRingGauge(percent, color, size){
  size = size || 96;
  const thickness = Math.round(size*0.16);
  const p = Math.max(0, Math.min(100, percent));
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${color} ${p*3.6}deg, var(--ring-track) 0deg);display:flex;align-items:center;justify-content:center;">
    <div style="width:${size-thickness*2}px;height:${size-thickness*2}px;border-radius:50%;background:var(--card);"></div>
  </div>`;
}

function renderDashboard(){
  const low = lowStockItems();
  const totalProduced = DB.production.reduce((s,p)=>s+(Number(p.produced)||0),0);
  const totalWaste = DB.waste.reduce((s,w)=>s+(Number(w.qty)||0),0);
  const lastProdDate = DB.production.length? DB.production.map(p=>p.date).sort().slice(-1)[0] : null;
  const wasteRatio = (totalProduced+totalWaste) > 0 ? (totalWaste/(totalProduced+totalWaste))*100 : 0;
  const efficiency = 100 - wasteRatio;
  const totalDowntime = DB.breakdowns.reduce((s,b)=>s+totalMinutes(b.from,b.to),0);
  const ringColor = efficiency>90?'#1FA97C':(efficiency>75?'#FEB913':'#E0435B');

  // Build production-by-date data
  const byDate = {};
  DB.production.forEach(p=>{ if(!p.date) return; byDate[p.date] = (byDate[p.date]||0) + (Number(p.produced)||0); });
  const prodDates = Object.keys(byDate).sort();

  // Build waste-by-reason data
  const byReason = {};
  DB.waste.forEach(w=>{ const r = w.reason && w.reason.trim() ? w.reason.trim() : 'غير محدد'; byReason[r]=(byReason[r]||0)+(Number(w.qty)||0); });
  const wasteSegments = Object.keys(byReason).map((r,i)=>({label:r, value:byReason[r], color:CHART_PALETTE[i%CHART_PALETTE.length]}));

  let html = `
  <div class="cards-grid">
    <div class="stat-card">
      <div class="icon-wrap">${svgIcon('raw')}</div>
      <div class="label">إجمالي أصناف الخامات</div>
      <div class="value">${DB.raw.length}</div>
      <div class="foot">صنف مسجل في المخزون</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap">${svgIcon('rolls')}</div>
      <div class="label">فئات فرعية داخل مخزن الخامات</div>
      <div class="value">${new Set(DB.raw.map(r=>(r.category||'').trim()).filter(Boolean)).size}</div>
      <div class="foot">مثل: طعوم، صبغه، رولات، كراتين...</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap ${low.length?'danger':'ok'}">${svgIcon('alert')}</div>
      <div class="label">أصناف تحت حد الأمان</div>
      <div class="value ${low.length?'alert':''}">${low.length}</div>
      <div class="foot">حد الأمان الحالي: ${fmtNum(DB.settings.lowStockThreshold)} كجم/وحدة</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap gold">${svgIcon('box')}</div>
      <div class="label">إجمالي الكمية المنتجة</div>
      <div class="value">${fmtNum(totalProduced)}</div>
      <div class="foot">${lastProdDate? 'آخر تسجيل: '+fmtDateAr(lastProdDate): 'لا يوجد تسجيلات'}</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap danger">${svgIcon('waste')}</div>
      <div class="label">إجمالي الهالك المسجل</div>
      <div class="value">${fmtNum(totalWaste)}</div>
      <div class="foot">عبر ${DB.waste.length} سجل هالك</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap">${svgIcon('clock')}</div>
      <div class="label">إجمالي زمن التوقف</div>
      <div class="value">${Math.floor(totalDowntime/60)}<span style="font-size:15px">س</span> ${totalDowntime%60}<span style="font-size:15px">د</span></div>
      <div class="foot">عبر ${DB.breakdowns.length} عطل مسجل</div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>الإنتاج اليومي (كمية منتجة لكل تاريخ)</h3>
      <div class="chart-holder">
        ${prodDates.length? htmlBarChart(prodDates.map(fmtDateAr), prodDates.map(d=>byDate[d])) : `<div class="chart-empty">لا يوجد بيانات إنتاج بعد</div>`}
      </div>
    </div>
    <div class="chart-card kpi-block">
      <h3>مؤشر الكفاءة</h3>
      <div class="kpi-ring-card">
        <div class="kpi-ring-wrap">
          ${htmlRingGauge(efficiency, ringColor, 96)}
          <div class="kpi-center">
            <div class="pct">${efficiency.toFixed(1)}%</div>
            <div class="pct-label">كفاءة</div>
          </div>
        </div>
        <div>
          <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;">نسبة الهالك من إجمالي (إنتاج + هالك)</div>
          <div style="font-size:22px;font-weight:800;color:${wasteRatio>10?'var(--danger)':'var(--navy)'}">${wasteRatio.toFixed(1)}%</div>
        </div>
      </div>
      <h3 style="margin-top:20px;">الهالك حسب السبب</h3>
      ${wasteSegments.length? `
        <div class="chart-holder" style="height:120px;">${htmlDonutChart(wasteSegments, 110)}</div>
        ${donutLegend(wasteSegments)}
      ` : `<div class="chart-empty" style="height:120px;">لا يوجد بيانات هالك بعد</div>`}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>أصناف تحت حد الأمان (${low.length})</h2>
      <div class="threshold-box">
        حد الأمان:
        <input type="number" id="thresholdInput" value="${DB.settings.lowStockThreshold}" min="0" step="1">
        <button class="btn btn-ghost btn-sm" id="applyThreshold">تطبيق</button>
      </div>
    </div>
    <div class="panel-body">
      ${low.length? `
      <div class="table-wrap"><table>
        <thead><tr><th>النوع</th><th>الصنف</th><th>التفاصيل</th><th>الرصيد الحالي</th></tr></thead>
        <tbody>
          ${low.map(i=>`
            <tr>
              <td><span class="pill pill-navy">${i.kind}</span></td>
              <td style="font-weight:700">${esc(i.name)}</td>
              <td class="muted">${esc(i.category||i.flavor||i.size||'')}${i.supplier?' · '+esc(i.supplier):''}</td>
              <td class="num" style="color:var(--danger)">${fmtNum(i.balance)}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>` : `<div class="empty-state"><div class="big">✓</div>كل الأصناف فوق حد الأمان حاليًا</div>`}
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>آخر عمليات الإنتاج</h2></div>
    <div class="panel-body">
      ${DB.production.length? `
      <div class="table-wrap"><table>
        <thead><tr><th>التاريخ</th><th>الأوردر</th><th>الصنف</th><th>الطعم</th><th>عدد الحلل</th><th>الكمية المنتجة</th></tr></thead>
        <tbody>
        ${[...DB.production].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6).map(p=>`
          <tr>
            <td>${fmtDateAr(p.date)}</td>
            <td>${esc(p.order)}</td>
            <td>${esc(p.item)}</td>
            <td>${esc(p.flavor)}</td>
            <td class="num">${fmtNum(p.drums)}</td>
            <td class="num">${fmtNum(p.produced)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>` : `<div class="empty-state">${svgIcon('production')}<div>لا يوجد تسجيلات إنتاج بعد</div></div>`}
    </div>
  </div>
  `;
  document.getElementById('content').innerHTML = `<div class="content-fade">${html}</div>`;
  document.getElementById('applyThreshold').addEventListener('click', async ()=>{
    const v = Number(document.getElementById('thresholdInput').value)||0;
    DB.settings.lowStockThreshold = v;
    logAction(`غيّر حد الأمان للمخزون إلى ${v}`);
    await persist();
    renderDashboard();
    showToast('تم تحديث حد الأمان');
  });
}

const FORCED_RAW_SUBCATS = ['علب','استيكر']; // تظهر دايماً كتابات حتى لو لسه مفيش أصناف فيها
function getRawSubcats(){
  const fromData = DB.raw.map(r=>(r.category||'').trim()).filter(Boolean);
  let cats = [...new Set([...fromData, ...FORCED_RAW_SUBCATS])].sort((a,b)=>a.localeCompare(b,'ar'));
  const lim = allowedRawCats(); if(lim) cats = cats.filter(c=>lim.includes(c));
  return cats.map(c=>({id:c, label:c, addLabel:`إضافة صنف جديد لفئة "${c}"`}));
}

/* ================= FLAVOR/RAW-CATEGORY EXPIRY HELPERS ================= */
function monthsBetween(fromISO, toISO){
  const a = new Date(fromISO), b = new Date(toISO);
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime())) return null;
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m -= 1;
  return m;
}
function expiryStatus(expiryDate){
  if(!expiryDate) return null;
  const today = todayISO();
  const dt = new Date(expiryDate);
  if(Number.isNaN(dt.getTime())) return null;
  if(expiryDate < today) return {label:'منتهي الصلاحية', cls:'pill-danger'};
  const m = monthsBetween(today, expiryDate);
  if(m !== null && m <= 3) return {label:'قريب من الانتهاء', cls:'pill-warn'};
  return {label:'سليم', cls:'pill-ok'};
}
function categoryItems(cat){
  return DB.raw.filter(r => (r.category||'').trim()===cat);
}

function durationLabel(from,to){
  if(!from || !to) return '—';
  const [fh,fm] = from.split(':').map(Number);
  const [th,tm] = to.split(':').map(Number);
  if([fh,fm,th,tm].some(isNaN)) return '—';
  let mins = (th*60+tm) - (fh*60+fm);
  if(mins < 0) mins += 24*60;
  const h = Math.floor(mins/60), m = mins%60;
  return (h?`${h} س `:'') + `${m} د`;
}

/* Quick production summary card shown above the الإنتاج اليومي table: rolling 7 days + current calendar month, broken down by order */
function renderProductionSummary(){
  const today = todayISO();
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate()-6);
  const weekStartISO = weekStart.toISOString().slice(0,10);
  const monthPrefix = today.slice(0,7);

  const weekItems = DB.production.filter(p=> p.date && p.date>=weekStartISO && p.date<=today);
  const monthItems = DB.production.filter(p=> p.date && p.date.startsWith(monthPrefix));

  const sumProduced = arr=> arr.reduce((s,p)=>s+(Number(p.produced)||0),0);
  const weekTotal = sumProduced(weekItems);
  const monthTotal = sumProduced(monthItems);
  const monthOrdersCount = new Set(monthItems.map(p=>(p.order&&p.order.trim())?p.order.trim():'بدون أوردر')).size;

  // breakdown by order for the current month
  const byOrder = {};
  monthItems.forEach(p=>{
    const key = (p.order&&p.order.trim())?p.order.trim():'بدون أوردر';
    if(!byOrder[key]) byOrder[key] = { order:key, produced:0, drums:0, runs:0 };
    byOrder[key].produced += Number(p.produced)||0;
    byOrder[key].drums += Number(p.drums)||0;
    byOrder[key].runs += 1;
  });
  const orderBreakdown = Object.values(byOrder).sort((a,b)=>b.produced-a.produced);
  const maxProduced = orderBreakdown.length ? orderBreakdown[0].produced : 0;

  return `
  <div class="cards-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px;">
    <div class="stat-card">
      <div class="icon-wrap">${svgIcon('clock')}</div>
      <div class="label">إنتاج آخر 7 أيام</div>
      <div class="value">${fmtNum(weekTotal)}</div>
      <div class="foot">${weekItems.length} تسجيل إنتاج</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap gold">${svgIcon('box')}</div>
      <div class="label">إنتاج الشهر الحالي</div>
      <div class="value">${fmtNum(monthTotal)}</div>
      <div class="foot">${monthItems.length} تسجيل إنتاج</div>
    </div>
    <div class="stat-card">
      <div class="icon-wrap ok">${svgIcon('orders')}</div>
      <div class="label">أوردرات نشطة هذا الشهر</div>
      <div class="value">${monthOrdersCount}</div>
      <div class="foot">أوردر مختلف تم الإنتاج له</div>
    </div>
  </div>
  ${orderBreakdown.length ? `
  <div class="chart-card" style="margin-bottom:14px;">
    <h3>الإنتاج حسب الأوردر — الشهر الحالي</h3>
    <div class="order-breakdown-list">
      ${orderBreakdown.map(o=>`
        <div class="order-breakdown-row">
          <span class="ob-name">${esc(o.order)}</span>
          <div class="ob-bar-track"><div class="ob-bar-fill" style="width:${maxProduced? Math.max(4, (o.produced/maxProduced*100)) : 0}%"></div></div>
          <span class="ob-value">${fmtNum(o.produced)} <span class="muted" style="font-weight:600;font-size:11.5px">· ${o.runs} تشغيلة</span></span>
        </div>`).join('')}
    </div>
  </div>` : ''}`;
}

function exportToExcel(tabId){
  const cfg = CONFIGS[tabId];
  let list = getFilteredList(tabId);
  let fileTag = todayISO();

  if(tabId==='production' && selectedProdGroups.size){
    const parsedKeys = [...selectedProdGroups].map(parseProdGroupKey);
    list = DB.production.filter(item=>{
      const ord = (item.order&&item.order.trim())?item.order.trim():'بدون أوردر';
      return parsedKeys.some(pk=> pk.date===item.date && pk.order===ord);
    });
    fileTag = parsedKeys.length===1
      ? `${parsedKeys[0].order}-${parsedKeys[0].date}`
      : `${parsedKeys.length}-اوردرات-${todayISO()}`;
  }

  if(!list.length){ showToast('لا يوجد بيانات لتصديرها'); return; }
  const baseColumns = (tabId==='raw' && rawSubTab!=='all' && cfg.columnsWithExpiry) ? cfg.columnsWithExpiry : cfg.columns;
  const exportCols = baseColumns.filter(c=>c.key!=='adjust' && c.key!=='duration' && c.key!=='expiryStatus');
  const rows = list.map(item=>{
    const row = {};
    exportCols.forEach(c=>{ row[c.label] = item[c.key]===undefined||item[c.key]===null ? '' : item[c.key]; });
    if(baseColumns.some(c=>c.key==='duration')) row['المدة'] = durationLabel(item.from, item.to);
    if(baseColumns.some(c=>c.key==='expiryStatus')){ const st = expiryStatus(item.expiryDate); row['الحالة'] = st ? st.label : ''; }
    return row;
  });

  if(window.XLSX){
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, cfg.title.slice(0,28));
    XLSX.writeFile(wb, `${cfg.title}-${fileTag}.xlsx`);
    showToast('تم تصدير الملف');
    return;
  }

  // Fallback: plain CSV export (no external library needed) if XLSX failed to load
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')];
  rows.forEach(r=>{
    csvLines.push(headers.map(h=>{
      const v = String(r[h]===undefined||r[h]===null?'':r[h]).replace(/"/g,'""');
      return `"${v}"`;
    }).join(','));
  });
  const csvContent = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${cfg.title}-${fileTag}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('تم تصدير الملف (CSV)');
}

function getFilteredList(tabId){
  const cfg = CONFIGS[tabId];
  let list = [...DB[tabId]];
  if(tabId==='raw') list = list.filter(rawCatAllowed);
  if(tabId==='waste' && !isAllWhUser()){ const ls=wasteWhLabels(); list = list.filter(w=>ls.includes(w.warehouse)); }
  if(tabId==='raw' && rawSubTab!=='all'){
    list = list.filter(item=> (item.category||'').trim()===rawSubTab);
  }
  if(tableState.search){
    const q = tableState.search.trim().toLowerCase();
    list = list.filter(item=> cfg.searchKeys.some(k=> String(item[k]||'').toLowerCase().includes(q)));
  }
  if(cfg.filterKey && tableState.filter){
    if(tableState.filter === '__NONE__'){
      list = list.filter(item=> !(item[cfg.filterKey]||'').toString().trim());
    } else {
      list = list.filter(item=> (item[cfg.filterKey]||'').toString().trim() === tableState.filter);
    }
  }
  if(cfg.dateKey){
    if(tableState.fromDate){ list = list.filter(item=> (item[cfg.dateKey]||'') >= tableState.fromDate); }
    if(tableState.toDate){ list = list.filter(item=> (item[cfg.dateKey]||'') <= tableState.toDate); }
    list.sort((a,b)=> (b[cfg.dateKey]||'').localeCompare(a[cfg.dateKey]||''));
  }
  if(tabId==='fillingReports' || tabId==='productionReports'){
    list.sort((a,b)=> (a.order||'').localeCompare(b.order||'','ar') || (b.date||'').localeCompare(a.date||''));
  }
  return list;
}

function renderTableRows(tabId){
  const cfg = CONFIGS[tabId];
  const list = getFilteredList(tabId);
  const holder = document.getElementById('tableHolder');
  const columns = (tabId==='raw' && rawSubTab!=='all' && cfg.columnsWithExpiry) ? cfg.columnsWithExpiry : cfg.columns;

  if(!list.length){
    holder.innerHTML = `<div class="empty-state"><div class="big">∅</div>لا توجد نتائج مطابقة</div>`;
    return;
  }

  if(tabId==='production'){
    renderProductionGroupedRows(list, holder);
    return;
  }

  let rowsHtml = list.map(item=>{
    let cells = columns.map(col=>{
      if(col.key==='adjust'){
        if(isReadOnlyTab(tabId)) return `<td class="muted">—</td>`;
        return `<td>
          <div class="qty-adjust">
            <input type="number" step="0.01" placeholder="كمية" id="adj-${item.id}">
            <button class="btn btn-sm btn-ghost" data-act="minus" data-id="${item.id}">صرف −</button>
            <button class="btn btn-sm btn-ghost" data-act="plus" data-id="${item.id}">إضافة +</button>
          </div>
        </td>`;
      }
      if(col.key==='balance' || col.key==='qty' || col.key==='drums' || col.key==='produced' || col.key==='opening' || col.key==='added' || col.key==='removed' || col.key==='closing' || col.key==='receivedKg' || col.key==='remainingKg' || col.key==='waste' || col.key==='cartonsDelivered' || col.key==='cartonsRemaining' || col.key==='qtyToFilling' || col.key==='remainingToProduce'){
        const val = item[col.key];
        const isLow = col.key==='balance' && Number(val)<=itemMin(item);
        return `<td class="num" ${isLow ? 'style="color:var(--danger)"':''}>${fmtNum(val)}${col.key==='balance' && item.unit ? ` <span class="muted" style="font-weight:500;font-size:11.5px">${esc(item.unit)}</span>`:''}</td>`;
      }
      if(col.key==='date' || col.key==='productionDate' || col.key==='expiryDate' || col.key==='orderDate' || col.key==='receiveDate'){
        const dv = item[col.key];
        const isExpiringDate = col.key==='expiryDate' && expiryStatus(dv) && expiryStatus(dv).cls!=='pill-ok';
        return `<td ${isExpiringDate?'style="color:var(--danger);font-weight:700"':''}>${dv? fmtDateAr(dv) : '<span class="muted">—</span>'}</td>`;
      }
      if(col.key==='expiryStatus'){
        const st = expiryStatus(item.expiryDate);
        return `<td>${st ? `<span class="pill ${st.cls}">${st.label}</span>` : '<span class="muted">—</span>'}</td>`;
      }
      if(col.key==='duration'){
        return `<td>${durationLabel(item.from,item.to)}</td>`;
      }
      if(col.key==='category' && item.category){
        return `<td><span class="pill pill-navy">${esc(item.category)}</span></td>`;
      }
      if(col.key==='order' && item.order){
        return `<td><span class="pill pill-navy">${esc(item.order)}</span></td>`;
      }
      return `<td>${esc(item[col.key]) || '<span class="muted">—</span>'}</td>`;
    }).join('');
    const hasHistory = (tabId==='raw' || tabId==='rolls' || tabId==='cartons' || tabId==='whManufacturing' || tabId==='whPackaging' || tabId==='whFinished' || tabId==='suppliers');
    return `<tr data-id="${item.id}">
      ${cells}
      <td>
        <div class="row-actions">
          ${hasHistory ? `<button class="icon-btn" data-act="history" data-id="${item.id}" title="سجل الحركة">${svgIcon('history','sm')}</button>` : ''}
          ${tabId==='waste' ? `<button class="icon-btn" data-act="wa" data-id="${item.id}" title="تحميل التقرير PDF">${svgIcon('print','sm')}</button>` : ''}
          ${isReadOnlyTab(tabId) ? '' : `<button class="icon-btn" data-act="edit" data-id="${item.id}" title="تعديل">${svgIcon('edit','sm')}</button>
          <button class="icon-btn danger" data-act="delete" data-id="${item.id}" title="حذف">${svgIcon('trash','sm')}</button>`}
        </div>
      </td>
    </tr>`;
  }).join('');

  holder.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;

  holder.querySelectorAll('[data-act="wa"]').forEach(b=>b.addEventListener('click', ()=>shareWasteReport(b.dataset.id)));
  holder.querySelectorAll('[data-act="history"]').forEach(b=>b.addEventListener('click', ()=>{
    const item = DB[tabId].find(i=>i.id===b.dataset.id);
    openHistoryDrawer(tabId, item);
  }));
  holder.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener('click', ()=>{
    const item = DB[tabId].find(i=>i.id===b.dataset.id);
    openItemModal(tabId, item);
  }));
  holder.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', ()=>{
    confirmDelete(tabId, b.dataset.id);
  }));
  holder.querySelectorAll('[data-act="plus"],[data-act="minus"]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.dataset.id;
    const input = document.getElementById('adj-'+id);
    const amt = Number(input.value);
    if(!amt || amt<=0){ showToast('اكتب كمية صحيحة أولاً'); return; }
    const item = DB[tabId].find(i=>i.id===id);
    const isMinus = b.dataset.act==='minus';
    const prevTabId = WH_PREV_TABID[tabId];

    if(isMinus && prevTabId){
      // بدل ما الكمية المصروفة تختفي، بترجع تلقائي لنفس الصنف في المخزن اللي قبله في السلسلة
      item.balance = Math.round((item.balance - amt)*100)/100;
      cascadeReturnToPrev(tabId, item, amt, null, true);
      logAction(`أرسل مرتجع ${fmtNum(amt)} من "${item.name}" (${TITLES[tabId][0]}) لـ ${TITLES[prevTabId][0]} — في انتظار الاستلام`);
      await persist();
      renderTableRows(tabId);
      renderNav();
      showToast(`تم إرسال ${fmtNum(amt)} من "${item.name}" لـ ${TITLES[prevTabId][0]} — مستني تأكيد الاستلام`);
      return;
    }

    const sign = isMinus ? -1 : 1;
    item.balance = Math.round((item.balance + sign*amt)*100)/100;
    item.history = item.history || [];
    item.history.push({date: todayISO(), ts: new Date().toISOString(), type: sign>0?'اضافه':'صرف', qty: amt, by: userTag()});
    logAction(`${sign>0?'أضاف':'صرف'} ${fmtNum(amt)} لصنف "${item.name}" (${TITLES[tabId][0]})`);
    await persist();
    renderTableRows(tabId);
    renderNav();
    showToast(`تم تسجيل ${sign>0?'إضافة':'صرف'} ${amt} لصنف "${item.name}"`);
  }));
}

/* Production tab: rows grouped by (date + order) — click a group to select+open it; export then targets only that order */
function renderProductionGroupedRows(list, holder){
  const cfg = CONFIGS.production;

  const groupMap = new Map();
  list.forEach(item=>{
    const key = `${item.date||''}__${(item.order&&item.order.trim())?item.order.trim():'بدون أوردر'}`;
    if(!groupMap.has(key)){
      groupMap.set(key, { key, date:item.date, order:(item.order&&item.order.trim())?item.order.trim():'بدون أوردر', items:[] });
    }
    groupMap.get(key).items.push(item);
  });
  const groups = [...groupMap.values()];

  const colCount = cfg.columns.length + 1;

  const rowsHtml = groups.map(g=>{
    const isSelected = selectedProdGroups.has(g.key);
    const totalDrums = g.items.reduce((s,i)=> s + (Number(i.drums)||0), 0);
    const totalProduced = g.items.reduce((s,i)=> s + (Number(i.produced)||0), 0);

    const headerRow = `
    <tr class="group-row ${isSelected?'expanded selected':''}" data-group="${esc(g.key)}">
      <td colspan="${colCount}">
        <div class="group-row-inner">
          <span class="group-check ${isSelected?'checked':''}" title="تحديد هذا الأوردر (يمكن تحديد أكثر من أوردر)"></span>
          <button class="group-toggle" data-group="${esc(g.key)}" title="عرض/إخفاء الأصناف">${svgIcon('chevron','sm')}</button>
          <span class="group-date">${fmtDateAr(g.date)}</span>
          <span class="group-order-badge">${esc(g.order)}</span>
          <span class="group-meta">${g.items.length} صنف · ${fmtNum(totalDrums)} حلة · ${fmtNum(totalProduced)} كمية منتجة</span>
          <button class="btn btn-sm btn-ghost group-add" data-date="${esc(g.date||'')}" data-order="${esc(g.order==='بدون أوردر'?'':g.order)}">+ إضافة صنف لنفس الأوردر</button>
        </div>
      </td>
    </tr>`;

    let detailRows = '';
    if(isSelected){
      detailRows = g.items.map(item=>{
        const cells = cfg.columns.map(col=>{
          if(col.key==='date' || col.key==='order') return `<td class="muted">—</td>`;
          if(col.key==='drums' || col.key==='produced'){
            return `<td class="num">${fmtNum(item[col.key])}</td>`;
          }
          return `<td>${esc(item[col.key]) || '<span class="muted">—</span>'}</td>`;
        }).join('');
        return `<tr class="detail-row" data-id="${item.id}">
          ${cells}
          <td>
            <div class="row-actions">
              <button class="icon-btn" data-act="edit" data-id="${item.id}" title="تعديل">${svgIcon('edit','sm')}</button>
              <button class="icon-btn danger" data-act="delete" data-id="${item.id}" title="حذف">${svgIcon('trash','sm')}</button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    return headerRow + detailRows;
  }).join('');

  holder.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${cfg.columns.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;

  holder.querySelectorAll('.group-row').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.group-add')) return;
      const key = el.dataset.group;
      if(!key) return;
      if(selectedProdGroups.has(key)) selectedProdGroups.delete(key);
      else selectedProdGroups.add(key);
      renderTableRows('production');
      updateProdExportScopeUI();
    });
  });
  holder.querySelectorAll('.group-add').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      openItemModal('production', null, { date:b.dataset.date, order:b.dataset.order });
    });
  });
  holder.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    const item = DB.production.find(i=>i.id===b.dataset.id);
    openItemModal('production', item);
  }));
  holder.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();
    confirmDelete('production', b.dataset.id);
  }));

  updateProdExportScopeUI();
}

/* Parses a production group key ("date__order") back into its parts */
function parseProdGroupKey(key){
  const idx = key.indexOf('__');
  return { date: key.slice(0,idx), order: key.slice(idx+2) };
}

/* Updates the small hint/badge next to the Export button to reflect the current row selection */
function updateProdExportScopeUI(){
  const hint = document.getElementById('exportScopeHint');
  if(!hint) return;
  if(selectedProdGroups.size){
    const parsed = [...selectedProdGroups].map(parseProdGroupKey);
    const label = parsed.length===1
      ? `${esc(parsed[0].order)} · ${fmtDateAr(parsed[0].date)}`
      : `${parsed.length} أوردرات محددة`;
    hint.innerHTML = `<span class="export-scope-pill">تصدير: ${label} <button id="clearExportScope" title="إلغاء التحديد وتصدير الكل">✕</button></span>`;
    const clearBtn = document.getElementById('clearExportScope');
    if(clearBtn) clearBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      selectedProdGroups.clear();
      renderTableRows('production');
      updateProdExportScopeUI();
    });
  } else {
    hint.innerHTML = '';
  }
}

function confirmDelete(tabId, id){
  const item = DB[tabId].find(i=>i.id===id);
  const name = item.name || item.description || 'هذا العنصر';
  const prevTabId = WH_PREV_TABID[tabId];
  const hasBalance = prevTabId && Number(item.balance||0) > 0;
  const msg = hasBalance
    ? `هل تريد حذف "${esc(name)}"؟ الرصيد المتبقي (${fmtNum(item.balance)}) هيرجع تلقائي لـ ${TITLES[prevTabId][0]} قبل الحذف.`
    : `هل تريد حذف "${esc(name)}"؟ لا يمكن التراجع عن هذا الإجراء.`;
  openConfirmModal(msg, async ()=>{
    if(hasBalance){
      const qty = Number(item.balance);
      item.balance = 0;
      cascadeReturnToPrev(tabId, item, qty, `إرجاع رصيد متبقي قبل حذف الصنف من ${TITLES[tabId][0]}`);
    }
    if(tabId==='waste') wasteReverse(item);
    DB[tabId] = DB[tabId].filter(i=>i.id!==id);
    logAction(`حذف "${name}" من ${TITLES[tabId][0]}`);
    await persist();
    renderTableRows(tabId);
    renderNav();
    showToast(hasBalance ? 'تم الحذف وإرجاع الرصيد المتبقي تلقائي' : 'تم الحذف');
  });
}

/* ================= MODALS ================= */
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function getAllOrderNames(){
  // أوردرات العملاء بقت المصدر الوحيد للأوردرات — لو الأوردر معندوش رقم أوردر، استخدم اسم العميل بديل
  return [...new Set((DB.importedOrders||[]).map(o=>{
    const ono = (o.ono||'').trim();
    if(ono) return ono;
    return (o.cust||'').trim();
  }).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
}

// الأوردر ممكن يتاخد اسمه من رقم الأوردر (ono) أو من اسم العميل (لو معندوش رقم) — الدالة دي بترجع كل سجلات الأوردر المستورد المطابقة للاسم ده
function findCustomerOrdersByName(orderName){
  const name = (orderName||'').trim();
  if(!name) return [];
  return (DB.importedOrders||[]).filter(o=>{
    const ono = (o.ono||'').trim();
    const key = ono || (o.cust||'').trim();
    return key === name;
  });
}

// الكمية المطلوب إنتاجها لصنف معين تحت أوردر معين (بالكيلو) — محسوبة من بنود الأوردر المستورد: وزن الحبة × عدد بالوحدة × وحدات/كرتونة × عدد الكراتين
function getOrderRequiredQtyKg(orderName, itemName){
  const item = (itemName||'').trim();
  if(!item) return 0;
  let total = 0;
  findCustomerOrdersByName(orderName).forEach(o=>{
    (o.rows||[]).forEach(r=>{
      if((r.d||'').trim() === item){
        const grams = (Number(r.g)||0) * (Number(r.s)||0) * (Number(r.u)||0) * (Number(r.q)||0);
        total += grams/1000;
      }
    });
  });
  return total;
}

// إجمالي اللي اتسجل إنتاجه فعليًا (تقرير الانتاج) لصنف معين تحت أوردر معين — باستثناء صف معين لو بنعدله
function getOrderProducedQtyKg(orderName, itemName, excludeId){
  const item = (itemName||'').trim();
  return (DB.productionReports||[]).reduce((sum, r)=>{
    if(r.id===excludeId) return sum;
    if((r.order||'').trim()===((orderName||'').trim()) && (r.item||'').trim()===item){
      return sum + (Number(r.qtyToFilling)||0);
    }
    return sum;
  }, 0);
}

function openItemModal(tabId, item, presetVals){
  const cfg = CONFIGS[tabId];
  const isEdit = !!item;
  const val = (k, def)=> isEdit ? (item[k]!==undefined && item[k]!==null ? item[k] : '') : (presetVals && presetVals[k]!==undefined ? presetVals[k] : (def!==undefined?def:''));

  const fieldsHtml = cfg.fields.map(f=>{
    const id = 'f_'+f.key;
    let inputHtml = '';
    const defaultVal = f.key==='date' ? todayISO() : '';
    const v = val(f.key, defaultVal);
    let opts = [];
    if(f.type==='select'){
      opts = f.options || [];
      if(f.dynamicOptions==='orders'){
        opts = getAllOrderNames();
        // السجلات القديمة (زي "السعوديه") ممكن أوردرها مش موجود في أوردرات العملاء — نحافظ عليه
        if(v && !opts.includes(v)) opts = [v, ...opts];
      }
      if(f.dynamicOptions==='wasteWh'){
        opts = wasteWhLabels();
        if(opts.length===1 && !v) setTimeout(()=>{ const el=document.getElementById(id); if(el){ el.value=opts[0]; el.dispatchEvent(new Event('change')); } },0);
      }
      inputHtml = `<select id="${id}">
        <option value="">${f.placeholder||'— اختر الاوردر —'}</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
    } else if(f.type==='datalist'){
      const existing = [...new Set(DB.raw.map(r=>(r.category||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
      inputHtml = `<input type="text" id="${id}" value="${esc(v)}" list="${f.listId}" placeholder="اكتب فئة موجودة أو فئة جديدة">
        <datalist id="${f.listId}">${existing.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
    } else if(f.type==='number'){
      inputHtml = `<input type="number" step="${f.step||'1'}" id="${id}" value="${esc(v)}">`;
    } else if(f.type==='date'){
      inputHtml = `<input type="date" id="${id}" value="${esc(v)}">`;
    } else if(f.type==='time'){
      inputHtml = `<input type="time" id="${id}" value="${esc(v)}">`;
    } else if(f.itemsFromWh){
      inputHtml = `<input type="text" id="${id}" value="${esc(v)}" list="wasteItemsList" placeholder="اكتب أو اختار الصنف"><datalist id="wasteItemsList"></datalist><div class="muted" id="wasteBal" style="font-size:11.5px;margin-top:4px;"></div>`;
    } else {
      inputHtml = `<input type="text" id="${id}" value="${esc(v)}">`;
    }
    const hint = (f.dynamicOptions==='orders' && opts.length===0)
      ? `<div class="muted" style="font-size:11.5px;margin-top:4px;">لسه مفيش أوردرات عملاء برقم أوردر صالح (العدد المستورد حاليًا: ${(DB.importedOrders||[]).length}) — استورد أوردر من تبويب "أوردرات العملاء" الأول.</div>`
      : '';
    return `<div class="field"><label>${f.label}${f.required?' *':''}</label>${inputHtml}${hint}</div>`;
  }).join('');

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-head">
          <h3>${isEdit? 'تعديل': cfg.addLabel}</h3>
          <button class="modal-close" id="closeX">✕</button>
        </div>
        <div class="modal-body">${fieldsHtml}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
          <button class="btn btn-primary" id="saveBtn">${isEdit?'حفظ التعديلات':'إضافة'}</button>
        </div>
      </div>
    </div>`;

  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  if(tabId==='waste'){
    const whSel=document.getElementById('f_warehouse'), itIn=document.getElementById('f_item');
    const upd=()=>{
      const arr=whArray(wasteWhId(whSel.value));
      document.getElementById('wasteItemsList').innerHTML=arr.map(i=>`<option value="${esc(i.name)}">رصيد: ${fmtNum(i.balance)}</option>`).join('');
      const it=arr.find(i=>i.name.trim()===itIn.value.trim());
      document.getElementById('wasteBal').textContent = itIn.value.trim()? (it?`الرصيد الحالي: ${fmtNum(it.balance)}`:'') : '';
    };
    whSel.addEventListener('change',upd); itIn.addEventListener('input',upd); upd();
  }
  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const newData = {};
    let missingRequired = false;
    cfg.fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      let v = el.value;
      if(f.type==='number') v = v===''? null : Number(v);
      if(f.required && (v===''||v===null||v===undefined)) missingRequired = true;
      newData[f.key] = v;
    });
    if(missingRequired){ showToast('من فضلك املأ الحقول المطلوبة (*)'); return; }

    if(isEdit){
      const oldBal = Number(item.balance);
      if(tabId==='waste') wasteReverse(item);
      Object.assign(item, newData);
      if(tabId==='waste') wasteApply(item);
      if(Array.isArray(item.history) && newData.balance!==undefined && newData.balance!==null && !Number.isNaN(oldBal)){
        const diff = Math.round((Number(newData.balance) - oldBal)*100)/100;
        if(diff){
          item.history.push({date: todayISO(), ts: new Date().toISOString(), type: diff>0?'اضافه':'صرف', qty: Math.abs(diff), notes:'تعديل يدوي للرصيد', by: userTag()});
        }
      }
      logAction(`عدّل "${newData.name||newData.description||'عنصر'}" في ${TITLES[tabId][0]}`);
    } else {
      const rec = {id: uid(), ...newData};
      if(tabId==='waste') wasteApply(rec);
      if(tabId==='raw' || tabId==='rolls' || tabId==='whManufacturing' || tabId==='whPackaging' || tabId==='whFinished' || tabId==='suppliers') rec.history = [];
      DB[tabId].unshift(rec);
      logAction(`أضاف "${newData.name||newData.description||'عنصر جديد'}" في ${TITLES[tabId][0]}`);
    }
    await persist();
    closeModal();
    renderTableRows(tabId);
    renderNav();
    showToast(isEdit? 'تم حفظ التعديلات':'تمت الإضافة بنجاح');
  });
}

function buildItemLedger(item){
  const IN_TYPES = ['اضافه','شراء'];
  const OUT_TYPES = ['صرف','مرتجع'];
  const hist = [...(item.history||[])].sort((a,b)=>{
    const ta = a.ts || a.date || '';
    const tb = b.ts || b.date || '';
    return ta.localeCompare(tb);
  });
  const netChange = hist.reduce((s,h)=>{
    const qty = Number(h.qty)||0;
    if(IN_TYPES.includes(h.type)) return s+qty;
    if(OUT_TYPES.includes(h.type)) return s-qty;
    return s;
  },0);
  let running = (Number(item.balance)||0) - netChange;
  return hist.map(h=>{
    const qty = Number(h.qty)||0;
    const isIn = IN_TYPES.includes(h.type);
    const isOut = OUT_TYPES.includes(h.type);
    const opening = running;
    const added = isIn ? qty : 0;
    const removed = isOut ? qty : 0;
    const closing = opening + added - removed;
    running = closing;
    return {date:h.date, ts:h.ts, opening, added, removed, closing, notes:h.notes, by:h.by||''};
  });
}

// سلسلة المخازن: كل مخزن عارف مين المخزن اللي قبله عشان أي كمية تتشال منه ترجع تلقائي بدل ما تختفي
const TABID_TO_WHID = { raw:'raw', whManufacturing:'manufacturing', whPackaging:'packaging', whFinished:'finished' };
const WH_PREV_TABID = { whManufacturing:'raw', whPackaging:'whManufacturing', whFinished:'whPackaging' };

// بيسجل تحويل تلقائي بيرجع كمية "qty" من صنف tabId/item لنفس الصنف (بالاسم) في المخزن اللي قبله في السلسلة
function cascadeReturnToPrev(tabId, item, qty, note, needsReceipt){
  const prevTabId = WH_PREV_TABID[tabId];
  if(!prevTabId || !(qty>0)) return;
  if(needsReceipt){
    // مرتجع للمخزن اللي قبله — مستني أمين المخزن ده يأكد الاستلام
    const tid = uid();
    item.history = item.history || [];
    item.history.push({date:todayISO(), ts:new Date().toISOString(), type:'صرف', qty, notes:`مرتجع لـ ${TITLES[prevTabId][0]} (في انتظار الاستلام)`, refId:tid, by:userTag()});
    DB.transfers.unshift({
      id:tid, date:todayISO(), fromWarehouse:TABID_TO_WHID[tabId], toWarehouse:TABID_TO_WHID[prevTabId], notes: note || 'مرتجع',
      status:'pending', sentBy:userTag(), sentAt:new Date().toISOString(),
      lines:[{fromItemId:item.id, fromItemName:item.name, fromQty:qty}]
    });
    return;
  }
  const date = todayISO();
  const transferId = uid();
  item.history = item.history || [];
  item.history.push({date, type:'صرف', qty, notes: note || `إرجاع تلقائي لـ ${TITLES[prevTabId][0]}`, refId: transferId, by: userTag()});

  const prevArr = DB[prevTabId];
  let prevItem = prevArr.find(i=>i.name.trim()===item.name.trim());
  if(!prevItem){
    prevItem = {id:uid(), name:item.name, balance:0, history:[]};
    if(prevTabId==='raw'){ prevItem.category = item.category || ''; prevItem.supplier = ''; prevItem.variant=''; prevItem.barcode=''; prevItem.notes=''; prevItem.productionDate=''; prevItem.expiryDate=''; }
    prevArr.unshift(prevItem);
  }
  prevItem.balance = Math.round((prevItem.balance + qty)*100)/100;
  prevItem.history = prevItem.history || [];
  prevItem.history.push({date, type:'اضافه', qty, notes: note || `راجع تلقائي من ${TITLES[tabId][0]}`, refId: transferId, by: userTag()});

  DB.transfers.unshift({
    id:transferId, date, fromWarehouse:TABID_TO_WHID[tabId], toWarehouse:TABID_TO_WHID[prevTabId], notes: note || 'إرجاع تلقائي',
    lines:[{fromItemId:item.id, fromItemName:item.name, fromQty:qty, toItemId:prevItem.id, toItemName:prevItem.name, toQty:qty}]
  });
}

  document.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener('click', ()=>{
    const r = (DB.cairoRequests||[]).find(x=>x.id===b.dataset.id);

      DB.cairoRequests = DB.cairoRequests.filter(x=>x.id!==b.dataset.id);

      renderNav();

}

          </div>

          <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
